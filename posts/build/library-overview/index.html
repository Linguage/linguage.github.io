e,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L17\"}]\n"])</script><script>self.__next_f.push([1,"17:[[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"为什么单独做一座书库\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#为什么单独做一座书库\",\"children\":\"为什么单独做一座书库\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"我在阅读中经常遇到这样的情况：一篇文章值得保存，继续追下去，又会找到同一位作者的其他文章、一次访谈或者一整套课程。单篇收藏很容易留下，想把这些内容连续读完，就需要更清楚的目录。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[\"我用Linguista Library整理这些材料。这里收录值得反复阅读的文章、访谈与课程笔记，首页分为\",[\"$\",\"a\",null,{\"href\":\"/library/#persons\",\"children\":\"人物文集\"}],\"、\",[\"$\",\"a\",null,{\"href\":\"/library/#channels\",\"children\":\"频道精选\"}],\"和\",[\"$\",\"a\",null,{\"href\":\"/library/#courses\",\"children\":\"课程研读\"}],\"三个入口。每个入口都围绕一个明确对象展开，读者可以沿着作者、频道或课程继续读下去。\"]}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"人物文集\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#人物文集\",\"children\":\"人物文集\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[\"人物文集目前收录\",[\"$\",\"a\",null,{\"href\":\"/library/persons/paul-graham\",\"children\":\"Paul Graham\"}],\"、\",[\"$\",\"a\",null,{\"href\":\"/library/persons/terencetao\",\"children\":\"Terence Tao\"}],\"、\",[\"$\",\"a\",null,{\"href\":\"/library/persons/naval\",\"children\":\"Naval Ravikant\"}],\"等作者，也包括《收获与播种》这样的专门阅读项目。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"每个人物都有独立首页，文章在人物页面中形成文集。Paul Graham的内容涉及创业、编程、写作和独立思考；Terence Tao的文集侧重数学研究、职业发展与学术写作；Naval的文章和访谈涉及财富、哲学与个人生活。读者可以先选择自己关心的人，再决定从哪一篇开始。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"部分文集提供原文与中文版本。中文内容用于快速理解和连续阅读，页面同时保留原文入口与来源信息。遇到原文中的链接、上下文或表述需要进一步确认时，仍可以回到作者的网站。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"频道精选\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#频道精选\",\"children\":\"频道精选\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[\"有些值得保存的内容属于播客、媒体和长期更新的频道。我在Library设置了\",[\"$\",\"a\",null,{\"href\":\"/library/#channels\",\"children\":\"频道集合\"}],\"，例如Lenny's Podcast与Quanta Magazine。访谈、科学报道和其他长内容可以沿着来源集中浏览，避免一篇文章读完之后失去上下文。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"频道和人物有时会重合，但阅读线索不同。人物文集跟随作者，频道集合跟随内容来源。这个区分让同一位受访者、同一个主题或同一档节目能够从不同方向进入。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"课程研读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#课程研读\",\"children\":\"课程研读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"a\",null,{\"href\":\"/library/#courses\",\"children\":\"课程页面\"}],\"按课程、模块和讲次整理材料。目前内容主要集中在AI、智能体和AI辅助开发，包括\",[\"$\",\"a\",null,{\"href\":\"/library/courses/andrew-ng-agentic-ai\",\"children\":\"Andrew Ng的Agentic AI\"}],\"、\",[\"$\",\"a\",null,{\"href\":\"/library/courses/agent-skills-with-anthropic\",\"children\":\"Anthropic Agent Skills\"}],\"、Gemini CLI与规格驱动开发等课程。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"一门课程可能包含课程介绍、讲义、脚本、笔记和延伸阅读。Library保留这种层级，让读者可以按顺序学习，也可以直接进入其中一讲。课程原始信息与来源链接会随内容保留，方便核对和继续学习。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"怎样使用library\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#怎样使用library\",\"children\":\"怎样使用Library\"}]}],\"\\n\",[\"$\",\"p\",nu
