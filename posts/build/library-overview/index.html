\",null,{\"href\":\"/library/persons/paul-graham\",\"children\":\"Paul Graham\"}],\"、\",[\"$\",\"a\",null,{\"href\":\"/library/persons/terencetao\",\"children\":\"Terence Tao\"}],\"、\",[\"$\",\"a\",null,{\"href\":\"/library/persons/naval\",\"children\":\"Naval Ravikant\"}],\"等作者。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"每个人物都有独立首页，文章在人物页面中形成文集。Paul Graham的内容涉及创业、编程、写作和独立思考；Terence Tao的文集侧重数学研究、职业发展与学术写作；Naval的文章和访谈涉及财富、哲学与个人生活。读者可以先选择自己关心的人，再决定从哪一篇开始。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"部分文集提供原文与中文版本。中文内容用于快速理解和连续阅读，页面同时保留原文入口与来源信息。遇到原文中的链接、上下文或表述需要进一步确认时，仍可以回到作者的网站。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"频道精选\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#频道精选\",\"children\":\"频道精选\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[\"有些值得保存的内容属于播客、媒体和长期更新的频道。我在Library设置了\",[\"$\",\"a\",null,{\"href\":\"/library/#channels\",\"children\":\"频道集合\"}],\"，例如Lenny's Podcast与Quanta Magazine。访谈、科学报道和其他长内容可以沿着来源集中浏览，避免一篇文章读完之后失去上下文。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"频道和人物有时会重合，但阅读线索不同。人物文集跟随作者，频道集合跟随内容来源。这个区分让同一位受访者、同一个主题或同一档节目能够从不同方向进入。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"图书与课程\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#图书与课程\",\"children\":\"图书与课程\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"a\",null,{\"href\":\"/library/#courses\",\"children\":\"图书与课程\"}],\"包括《收获与播种》这样的图书阅读项目，也按模块和讲次整理课程资料。目前课程主要集中在AI、智能体和AI辅助开发，包括\",[\"$\",\"a\",null,{\"href\":\"/library/courses/andrew-ng-agentic-ai\",\"children\":\"Andrew Ng的Agentic AI\"}],\"、\",[\"$\",\"a\",null,{\"href\":\"/librar
