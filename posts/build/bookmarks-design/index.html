,\"48\",\"static/chunks/app/%5B...slug%5D/page-9b24e191e5f66bdf.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L17\",null,{\"post\":{\"slug\":\"bookmarks-design\",\"href\":\"/posts/build/bookmarks-design\",\"category\":\"build\",\"title\":\"Bookmarks的专辑式书签\",\"date\":\"2026-10-06T00:00:00+08:00\",\"excerpt\":\"Bookmarks用专辑封面展示资源与教程，用紧凑的图标卡片集中呈现常用入口，以可翻阅的书签和阅读安排组织专题材料。\",\"coverImage\":\"$undefined\",\"author\":\"Codex\",\"publisher\":\"$undefined\",\"sourceUrl\":\"$undefined\",\"section\":\"posts\"},\"neighbors\":{\"previous\":null,\"next\":{\"slug\":\"site-overview\",\"href\":\"/posts/build/site-overview\",\"category\":\"build\",\"title\":\"Linguista 是一个什么样的网站\",\"date\":\"2026-07-17T08:03:00.000Z\",\"excerpt\":\"Linguista保存阅读材料、个人文章和开放项目。这篇文章介绍主站入口及四个子站各自收录的内容。\",\"coverImage\":\"$undefined\",\"author\":\"amp-smart\",\"publisher\":\"$undefined\",\"sourceUrl\":\"$undefined\",\"section\":\"posts\"}},\"headings\":[{\"depth\":2,\"text\":\"像专辑封面一样展示网站\",\"id\":\"像专辑封面一样展示网站\"},{\"depth\":2,\"text\":\"保留宽分类\",\"id\":\"保留宽分类\"},{\"depth\":2,\"text\":\"一叠可以翻阅的专题书签\",\"id\":\"一叠可以翻阅的专题书签\"}],\"sidebar\":{\"title\":\"Build\",\"href\":\"/posts/build\",\"items\":[{\"type\":\"entry\",\"title\":\"Bookmarks的专辑式书签\",\"href\":\"/posts/build/bookmarks-design\",\"pathSegments\":[\"build\",\"bookmarks-design\"]},{\"type\":\"entry\",\"title\":\"Linguista 是一个什么样的网站\",\"href\":\"/posts/build/site-overview\",\"pathSegments\":[\"build\",\"site-overview\"]},{\"type\":\"entry\",\"title\":\"AlpacaNotes里的个人记录\",\"href\":\"/posts/build/alpacanotes-overview\",\"pathSegments\":[\"build\",\"alpacanotes-overview\"]},{\"type\":\"entry\",\"title\":\"在Linguista Library连续阅读\",\"href\":\"/posts/build/library-overview\",\"pathSegments\":[\"build\",\"library-overview\"]},{\"type\":\"entry\",\"title\":\"Hinbox：用收件箱整理阅读材料\",\"href\":\"/posts/build/hinbox-overview\",\"pathSegments\":[\"build\",\"hinbox-overview\"]},{\"type\":\"entry\",\"title\":\"Rosetta分区的早期记录\",\"href\":\"/posts/build/rosetta-overview\",\"pathSegments\":[\"build\",\"rosetta-overview\"]}]},\"directoryHref\":\"/posts/build\",\"isLongArticle\":false,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L18\"}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"a\",null,{\"href\":\"/bookmarks/\",\"children\":\"Bookmarks\"}],\"保存数学、科学、编程与人文领域的网页入口。页面分为“资源”“教程”和“专题”：资源页收录平台、聚合、资讯、博客、播客、频道、阅读资料和工具，教程页整理课程、教材与技能教程，专题页把围绕同一个问题的原作、报道和分析放在一起。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"每张资源卡片都附有一段简述，说明网站的主要内容和用途。例如，数学资料有百科、问题讨论、历史档案等不同形态，这些区别需要在打开网页前就能看见。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"像专辑封面一样展示网站\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#像专辑封面一样展示网站\",\"children\":\"像专辑封面一样展示网站\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"资源页采用方形封面，网站标题占据主要位置。封面下方放置完整名称、简介和主题标签，浏览时可以先扫过名称，再看感兴趣的条目。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"不同来源有各自的配色和背景图形。YouTube使用红色与播放符号，Telegram使用蓝色与纸飞机，X使用黑白灰；数学资源以蓝色、米黄色和数学符号为主。标题的字号与位置随名称长短调整，同类资源保留相近的色调，排列在一起时有一组专辑的感觉。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"网站图标被缩小放在封面右下角。部分频道使用头像，普通网站则保留自己的小图标。小图标用于辨认来源，封面的视觉重点交给标题和背景。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"熟悉的平台和应用集中放在“常用”区域，采用图标、醒目的名称和一句用途说明组成的紧凑卡片。多行卡片交错滚动，悬停时停留，也可以暂停或左右滑动。这些入口便于直接访问；下面的专辑卡片则保留更多简介，供读者了解陌生的站点。教程页的学习平台也采用这种紧凑卡片，集中展示高校课程、技术培训与交互练习的入口。选择分类或输入搜索词后，入口以静态网格呈现，便于查找。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"保留宽分类\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#保留宽分类\",\"children\":\"保留宽分类\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[\"资源菜单包含常用、聚合、资讯、个人博客、技术博客、播客、频道、资料、平台和工具。工具类收录可直接使用的应用；聚合类收录Hacker News及其中文阅读入口，也包括汇总多个来源的资讯站点。账号和代码仓库按内容归类，主题信息留在卡片上，也可以通过搜索查找。课程与技能教程放在独立的\",[\"$\",\"a\",null,{\"href\":\"/bookmarks/tutorials/\",\"children\":\"“教程”页\"}],\"，分为综合学习、AI基础、AI应用、编程开发、数学计算、工具技能六类。资源与教程都按类别连续排列，也可以搜索名称、简介和主题。资源类内优先显示持续更新、读者或社区参与较多的站点，旧档案与小众入口排在后面。同一站点以一张卡片呈现；专栏、博客或语言版本等不同入口保留在卡片下方。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"宽屏下一行放四张卡片，窄屏改为两张，标题和简介随卡片宽度调整。卡片简介只介绍内容和用途。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"一叠可以翻阅的专题书签\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#一叠可以翻阅的专题书签\",\"children\":\"一叠可以翻阅的专题书签\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"a\",null,{\"href\":\"/bookmarks/topics/\",\"children\":\"专题\"}],\"按“资讯”“知识”“工具”组织，分别围绕报道与案例、概念与方法、软件与素材汇集材料。每个专题用导读交代所讨论的问题及材料之间的联系。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"专题材料采用接近纸质书签的样式：浅色纸面、细边框、右上角的小书签，以及后方略微错开的纸张。卡片显示当前材料的标题和来源网站，有日期的材料同时标出日期，点击卡片可以打开原文。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"卡片下方显示当前位置，可以点前后按钮，也可以拖动或滚动拨轮；键盘左右键和手机横向滑动同样支持。专题内的搜索用于缩小材料范围。每次呈现一份材料，读者可以根据标题和来源选择材料，再打开原文阅读。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"部分专题设有阅读安排，按阶段组织材料，并提供可以直接跳转的材料目录。卡片中的摘要和阅读用途说明材料讲了什么、适合在哪一步阅读。\"}]]\n"])</script><script>self.__next_f.push([1,"14:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n10:null\n"])</script><script>self.__next_f.push([1,"19:I[6644,[],\"IconMark\"]\n"])</script><script>self.__next_f.push([1,"12:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Bookmarks的专辑式书签 | Linguista\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bookmarks用专辑封面展示资源与教程，用紧凑的图
