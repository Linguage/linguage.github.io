归档。这篇文章介绍它目前的内容结构，以及主站与三个子站之间的关系。\",\"coverImage\":\"$undefined\",\"author\":\"amp-smart\",\"section\":\"posts\"},\"neighbors\":{\"previous\":null,\"next\":{\"slug\":\"alpacanotes-overview\",\"href\":\"/posts/build/alpacanotes-overview\",\"category\":\"build\",\"title\":\"AlpacaNotes：我的文章与日常笔记\",\"date\":\"2026-07-17T08:02:00.000Z\",\"excerpt\":\"AlpacaNotes是我的个人博客，保存完整文章、零碎笔记、专题和提示词。这篇文章介绍这些内容如何放在一起。\",\"coverImage\":\"$undefined\",\"author\":\"amp-smart\",\"section\":\"posts\"}},\"headings\":[{\"depth\":2,\"text\":\"一个持续生长的知识门户\",\"id\":\"一个持续生长的知识门户\"},{\"depth\":2,\"text\":\"主站与三个子站\",\"id\":\"主站与三个子站\"},{\"depth\":2,\"text\":\"几种阅读路径\",\"id\":\"几种阅读路径\"},{\"depth\":2,\"text\":\"经过筛选和整理的内容\",\"id\":\"经过筛选和整理的内容\"},{\"depth\":2,\"text\":\"怎样帮助读者找到内容\",\"id\":\"怎样帮助读者找到内容\"},{\"depth\":2,\"text\":\"一个持续生长的项目\",\"id\":\"一个持续生长的项目\"}],\"sidebar\":{\"title\":\"Build\",\"href\":\"/posts/build\",\"items\":[{\"type\":\"entry\",\"title\":\"Linguista 是一个什么样的网站\",\"href\":\"/posts/build/site-overview\",\"pathSegments\":[\"build\",\"site-overview\"]},{\"type\":\"entry\",\"title\":\"AlpacaNotes：我的文章与日常笔记\",\"href\":\"/posts/build/alpacanotes-overview\",\"pathSegments\":[\"build\",\"alpacanotes-overview\"]},{\"type\":\"entry\",\"title\":\"Linguista Library：人物、频道与课程的个人书库\",\"href\":\"/posts/build/library-overview\",\"pathSegments\":[\"build\",\"library-overview\"]},{\"type\":\"entry\",\"title\":\"Hinbox：用收件箱整理阅读材料\",\"href\":\"/posts/build/hinbox-overview\",\"pathSegments\":[\"build\",\"hinbox-overview\"]},{\"type\":\"entry\",\"title\":\"Rosetta 分区：一份导览\",\"href\":\"/posts/build/rosetta-overview\",\"pathSegments\":[\"build\",\"rosetta-overview\"]}]},\"directoryHref\":\"/posts/build\",\"isLongArticle\":false,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L19\"}]\n"])</script><script>self.__next_f.push([1,"19:[[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"一个持续生长的知识门户\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#一个持续生长的知识门户\",\"children\":\"一个持续生长的知识门户\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"Linguista（linguista.cn）从外表看是一个 Next.js 静态站点，但它和大多数个人博客不太一样。我把它作为一个围绕几个核心主题持续生长的内容系统。这些主题包括 AI 与智能体工作流、技术工具与软件工程、数学与科学方法、优秀文章和思想，以及每日精选内容的整理。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"这个站点的起点是个人阅读。我是一个兴趣广泛的阅读者，涉猎科技、历史、哲学、文学等领域，最近几年对大语言模型和基于 AI 的开发方式尤其着迷。阅读过程中积累了大量值得反复回看的内容，于是自然地想把它们系统化地整理出来、分享出去。Linguista 就是这个想法的产物。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"我把站点首页作为导航门户，引导读者进入不同的内容入口。这个设计选择反映了一个基本判断：对于一个内容类型丰富的站点，\\\"最新发布\\\"不一定是读者最需要看到的东西，\\\"找到自己感兴趣的板块\\\"才是。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"主站与三个子站\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#主站与三个子站\",\"children\":\"主站与三个子站\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[\"主站首页目前有\",[\"$\",\"a\",null,{\"href\":\"/about\",\"children\":\"About\"}],\"、\",[\"$\",\"a\",null,{\"href\":\"/whatsup\",\"children\":\"What's UP\"}],\"、\",[\"$\",\"a\",null,{\"href\":\"/bookmarks\",\"children\":\"Bookmarks\"}],\"和\",[\"$\",\"a\",null,{\"href\":\"/lab\",\"children\":\"Workshop\"}],\"四个入口，\",[\"$\",\"a\",null,{\"href\":\"/posts/build\",\"children\":\"Build\"}],\"栏目继续记录站点本身的变化。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":[\"$\",\"a\",null,{\"href\":\"/about\",\"children\":\"About（关于）\"}]}],\" 介绍我和这个站点，也保留其他个人页面、社交账号与联系方式。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":[\"$\",\"a\",null,{\"href\":\"/whatsup\",\"children\":\"What's UP（信息简报）\"}]}],\" 是更新最频繁、内容量最大的板块。它包含每日综述、主题专题、AI深度研究笔记、TL;DR摘要卡片、精选文章细节版与原创技术实践。这个板块的核心功能是快速吸收优质信息，并把它们沉淀为可检索的知识卡片。如果你想在短时间内获取经过筛选的高质量内容，这是最合适的入口。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":[\"$\",\"a\",null,{\"href\":\"/bookmarks\",\"children\":\"Bookmarks（书签）\"}]}],\" 保存我在阅读过程中收藏的网页目录。目前包括阅读收藏、课程资料和自媒体频道，内容涉及百科、科技媒体、个人博客、AI课程、播客与视频频道。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":[\"$\",\"a\",null,{\"href\":\"/lab\",\"children\":\"Workshop（实验室）\"}]}],\" 是我保存实验与原型记录的孵化区，当前内容还很少，也为后续项目探索保留了位置。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":[\"$\",\"a\",null,{\"href\":\"/posts/build\",\"children\":\"Build（站点更新）\"}]}],\" 是你现在正在阅读的栏目。我在这里保存站点内容更新说明、技术架构调整记录和建站过程复盘。想了解Linguista怎样发展到现在，可以从这个栏目开始。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[\"主站之外还有三个子站。\",[\"$\",\"strong\",null,{\"children\":[\"$\",\"a\",null,{\"href\":\"/alpacanotes/\",\"children\":\"AlpacaNotes\"}]}],\" 保存我的文章、日常笔记、专题和提示词；\",[\"$\",\"strong\",null,{\"children\":[\"$\",\"a\",null,{\"href\":\"/library/\",\"children\":\"Linguista Library\"}]}],\" 收录人物文集、频道内容和课程资料；\",[\"$\",\"strong\",null,{\"children\":[\"$\",\"a\",null,{\"href\":\"/hinbox/\",\"children\":\"Hinbox\"}]}],\" 采用收件箱式界面整理Essays、Reports、Talks和Notes，并提供人物、标签和搜索入口。我用三个子站分别处理个人写作、连续阅读和跨形式资料整理。\"]}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"几种阅读路径\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#几种阅读路径\",\"children\":\"几种阅读路径\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"从读者使用场景来看，站点提供了几种不同的进入方式。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[\"想快速获取经过筛选的信息，可以从\",[\"$\",\"a\",null,{\"href\":\"/whatsup\",\"children\":\"What's UP\"}],\"开始。想查找网站、课程和频道，可以进入\",[\"$\",\"a\",null,{\"href\":\"/bookmarks\",\"children\":\"Bookmarks\"}],\"。想读我的文章与日常笔记，可以访问\",[\"$\",\"a\",null,{\"href\":\"/alpacanotes/\",\"children\":\"AlpacaNotes\"}],\"。想沿着人物、频道或课程连续阅读，可以打开\",[\"$\",\"a\",null,{\"href\":\"/library/\",\"children\":\"Library\"}],\"。想按主题、人物和标签翻找文章、研究笔记、访谈与演讲，可以进入\",[\"$\",\"a\",null,{\"href\":\"/hinbox/\",\"children\":\"Hinbox\"}],\"。想了解站点本身的技术实现和演进过程，可以查看\",[\"$\",\"a\",null,{\"href\":\"/lab\",\"children\":\"Workshop\"}],\"和\",[\"$\",\"a\",null,{\"href\":\"/posts/build\",\"children\":\"Build\"}],\"。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"这些路径可以交叉使用，很多读者会在不同时间走不同的路线。它们反映了站点内容组织的基本逻辑：按读者意图分流，避免把所有内容混在一条时间线里。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"经过筛选和整理的内容\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#经过筛选和整理的内容\",\"children\":\"经过筛选和整理的内容\"}]}],\"\\n\",\"$L1a\",\"\\n\",\"$L1b\",\"\\n\",\"$L1c\",\"\\n\",\"$L1d\",\"\\n\",\"$L1e\",\"\\n\",\"$L1f\",\"\\n\",\"$L20\",\"\\n\",\"$L21\",\"\\n\",\"$L22\",\"\\n\",\"$L23\"]\n"])</script><script>self.__next_f.push([1,"1a:[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"我会筛选和整理这个站点收录的内容。\"}]\n1b:[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"我对自己发布的内容有一个基本要求——至少是自己愿意多读几遍的东西。无论是原创文章、翻译作品还是搬运分享的内容，都会经过一轮筛选和加工。大量内容从原始素材开始，经过中译、摘要、主题整理和专题归类，最终变成结构化的页面。\"}]\n1c:[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"这种做法的代价是更新速度不会太快，但好处是每一篇内容都有相对稳定的长期价值。站点追求的是\\\"可检索的知识沉淀\\\"，而不是\\\"持续的信息流\\\"。\"}]\n1d:[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"怎样帮助读者找到内容\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#怎样帮助读者找到内容\",\"children\":\"怎样帮助读者找到内容\"}]}]\n1e:[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"为了帮助读者找到内容，我在主站首页设置了门户导航，用tab组织What's UP的子栏目，并在部分内容区使用热力图和分页。AlpacaNotes提供时间线和日历，Library提供目录、搜索和前后阅读入口，Hinbox提供搜索、人物与标签筛选。\"}]\n1f:[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"这些设计都来自同一个判断：当内容类型足够丰富、数量足够多的时候，简单的文章列表已经不够用了，需要更多入口来帮助读者找到自己想看的东西。\"}]\n20:[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"一个持续生长的项目\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#一个持续生长的项目\",\"children\":\"一个持续生长的项目\"}]}]\n21:[\"$\",\"p\",null,{\"className\":\"mb-6\",\"child"])</script><script>self.__next_f.push([1,"ren\":\"我会继续更新Linguista的内容，也会随着内容增长调整它的结构。从最初的个人博客雏形，到现在由主站和三个子站组成的内容体系，这个过程本身也是一种学习和实践。\"}]\n22:[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"如果用一句话来概括：我把Linguista建成了一个以 AI、技术、学习与人物思想为核心主题的中文内容站点，用它保存信息精选、专题文集、课程资料、实验记录和知识归档。在我看来，它是一个持续生长的个人知识门户。\"}]\n23:[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[\"你可以从\",[\"$\",\"a\",null,{\"href\":\"/whatsup\",\"children\":\"What's UP\"}],\"浏览近期精选，也可以直接进入\",[\"$\",\"a\",null,{\"href\":\"/alpacanotes/\",\"children\":\"AlpacaNotes\"}],\"、\",[\"$\",\"a\",null,{\"href\":\"/library/\",\"children\":\"Library\"}],\"或\",[\"$\",\"a\",null,{\"href\":\"/hinbox/\",\"children\":\"Hinbox\"}],\"。欢迎探索，也欢迎通过评论区或社交媒体与我交流。\"]}]\n"])</script><script>self.__next_f.push([1,"15:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\nd:null\n"])</script><script>self.__next_f.push([1,"24:I[6644,[],\"IconMark\"]\n"])</script><script>self.__next_f.push([1,"f:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Linguista 是一个什么样的网站 | Linguista\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Linguista融合了信息精选、实验记录与知识归档。这篇文章介绍它目前的内容结构，以及主站与三个子站之间的关系。\"}],[\"$\",\"meta\",\"2\",{\"name\":\"keywords\",\"content\":\"站点介绍,知识管理,Next.js,内容架构,AI\"}],[\"$\",\"link\",\"3\",{\"rel\":\"canonical\",\"href\":\"https://linguista.cn/posts/build/site-overview/\"}],[\"$\",\"me
