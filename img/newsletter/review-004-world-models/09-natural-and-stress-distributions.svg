<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
<title id="title">自然交通与压力测试的场景分布</title>
<desc id="desc">两条等宽条形图显示危险场景比例由自然交通示例的百分之一，提高到压力测试示例的百分之五十。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#536a82"/></marker></defs>
<style>text{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;fill:#263340;font-weight:400}.label{font-size:32px;font-weight:500}.detail{font-size:28px}.small{font-size:26px}.arrow{fill:none;stroke:#536a82;stroke-width:3.5;stroke-linejoin:round;marker-end:url(#arrow)}.box{fill:#f1f5f8;stroke:#536a82;stroke-width:2}</style>
<rect width="760" height="500" fill="#fff"/>
<text x="40" y="54" text-anchor="start" class="label">自然交通</text>
<text x="720" y="54" text-anchor="end" class="detail">危险场景 1%</text>
<rect x="40" y="84" width="673.2" height="110" fill="#b7d3bd"/>
<rect x="713.2" y="84" width="6.8" height="110" fill="#d18f86"/>
<text x="40" y="274" text-anchor="start" class="label">压力测试</text>
<text x="720" y="274" text-anchor="end" class="detail">危险场景 50%</text>
<rect x="40" y="304" width="340" height="110" fill="#b7d3bd"/>
<rect x="380" y="304" width="340" height="110" fill="#d18f86"/>
<rect x="40" y="452" width="26" height="26" rx="2" fill="#b7d3bd"/>
<text x="80" y="476" text-anchor="start" class="detail">普通场景</text>
<rect x="390" y="452" width="26" height="26" rx="2" fill="#d18f86"/>
<text x="430" y="476" text-anchor="start" class="detail">危险场景</text>
</svg>