<svg xmlns="http://www.w3.org/2000/svg" width="760" height="820" viewBox="0 0 760 820" role="img" aria-labelledby="title desc">
<title id="title">环境表征、世界模型与驾驶策略</title>
<desc id="desc">多摄像头观测形成环境表征；世界模型预测动作后果，分别支持驾驶策略和训练评价。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#536a82"/></marker></defs>
<style>text{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;fill:#263340;font-weight:400}.label{font-size:32px;font-weight:500}.detail{font-size:28px}.small{font-size:26px}.arrow{fill:none;stroke:#536a82;stroke-width:3.5;stroke-linejoin:round;marker-end:url(#arrow)}.box{fill:#f1f5f8;stroke:#536a82;stroke-width:2}</style>
<rect width="760" height="820" fill="#fff"/>
<rect class="box" x="40" y="20" width="680" height="110" rx="16"/>
<text x="380" y="62" text-anchor="middle" class="label">环境观测</text>
<text x="380" y="104" text-anchor="middle" class="detail">多摄像头图像 · 车辆状态 · 导航</text>
<rect class="box" x="40" y="180" width="680" height="110" rx="16"/>
<text x="380" y="222" text-anchor="middle" class="label">环境表征</text>
<text x="380" y="264" text-anchor="middle" class="detail">道路布局 · 物体位置 · 运动特征</text>
<rect class="box" x="40" y="340" width="680" height="110" rx="16"/>
<text x="380" y="382" text-anchor="middle" class="label">世界模型</text>
<text x="380" y="424" text-anchor="middle" class="detail">预测未来场景 · 比较动作后果</text>
<path class="arrow" d="M 380 140 V 169"/>
<path class="arrow" d="M 380 300 V 329"/>
<path d="M 380 460 V 490 H 195 V 519 M 380 490 H 565 V 519" fill="none" stroke="#536a82" stroke-width="3.5" stroke-linejoin="round"/>
<path class="arrow" d="M 195 509 V 529"/>
<path class="arrow" d="M 565 509 V 529"/>
<rect class="box" x="20" y="540" width="350" height="170" rx="16"/>
<text x="195" y="587" text-anchor="middle" class="label">驾驶策略</text>
<text x="195" y="632" text-anchor="middle" class="detail">选择行驶轨迹</text>
<text x="195" y="675" text-anchor="middle" class="small">转向、加速与制动</text>
<rect class="box" x="390" y="540" width="350" height="170" rx="16"/>
<text x="565" y="587" text-anchor="middle" class="label">训练与评价</text>
<text x="565" y="632" text-anchor="middle" class="detail">合成场景</text>
<text x="565" y="675" text-anchor="middle" class="small">策略学习与仿真测试</text>
<path class="arrow" d="M 565 720 V 749"/>
<text x="565" y="794" text-anchor="middle" class="small">结果反馈与模型更新</text>
</svg>