ng-c7be5e1faa3dd33182ed.json\"},{\"href\":\"/whatsup/tldr/hn-2026-p9/manuel-neuer-bayern-preseason-training-camp\",\"title\":\"诺伊尔季前集训谈新赛季目标与退役计划\",\"date\":\"2026-07-29\",\"excerpt\":\"拜仁队长诺伊尔在泰根湖训练营回顾世界杯出局，阐述新赛季争冠目标，并坦言很可能在赛季结束后退役。\",\"tags\":[\"summary\"],\"contentUrl\":\"/whatsup-data/reading-9b07eb38f6cd8339b01a.json\"},{\"href\":\"/whatsup/tldr/hn-2026-p9/anthropic-position-on-open-weights-models\",\"title\":\"Anthropic 对开放权重模型的立场与主张\",\"date\":\"2026-07-28\",\"excerpt\":\"Anthropic CEO Dario Amodei 澄清公司从未主张禁止开放权重模型，提出芯片管制、打击蒸馏与强制安全测试三项替代方案，回应国家安全与滥用风险。\",\"tags\":[\"summary\"],\"contentUrl\":\"/whatsup-data/reading-3abead4743116e055b1c.json\"},{\"href\":\"/whatsup/tldr/hn-2026-p9/fields-medal-claiming-credit\",\"title\":\"菲尔兹奖之后的攀亲与反思\",\"date\":\"2026-07-26\",\"excerpt\":\"借王虹与邓煜获菲尔兹奖一事，批评成名后众人攀亲认领关系的刻奇现象，并反思中国基础教育擅长训练却难以容纳原创研究者的结构性缺陷。\",\"tags\":[\"summary\"],\"contentUrl\":\"/whatsup-data/reading-ee6ac5280a59787b875c.json\"},{\"href\":\"/whatsup/tldr/hn-2026-p9/wang-hong-fields-medal-profile\",\"title\":\"从北大数学系小透明到菲尔兹奖得主王虹专访\",\"date\":\"2026-07-24\",\"excerpt\":\"中国数学家王虹获2026年菲尔兹奖，成为首位中国籍女性得主。专访回溯她从北大转系的小透明到证明三维挂谷猜想的求索历程，展现热爱、挫败与坚持的力量。\",\"tags\":[\"summary\"],\"contentUrl\":\"/whatsup-data/reading-1d8bb8a0c6be30f8bb1f.json\"},{\"href\":\"/whatsup/tldr/hn-2026-p9/algebraic-geometry-landscapes\",\"title\":\"代数几何的千重风景：从圆锥曲线到概形\",\"date\":\"2026-07-24\",\"excerpt\":\"借Claire Voisin出任法兰西公学院首位数学女教授之机，巴黎南奥赛大学教授François Charles以问答形式讲述代数几何从古希腊圆锥曲线到格罗滕迪克概形理论的两千年演进及其当代活力。\",\"tags\":[\"summary\"],\"contentUrl\":\"/whatsup-data/reading-30a4796acb897839ad97.json\"},{\"href\":\"/whatsup/tldr/hn-2026-p9/open-weights-and-american-ai-leadership\",\"title\":\"开放权重与美国AI领导力之辩\",\"date\":\"2026-07-24\",\"excerpt\":\"微软等百余家机构联署主张，开放权重模型能扩大AI可及性、强化竞争与安全，美国应以开放生态而非封闭垄断引领AI时代。\",\"tags\":[\"summary\"],\"contentUrl\":\"/whatsup-data/reading-e824e720b89029c059be.json\"}]}}]}]\n"])</script><script>self.__next_f.push([1,"11:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"m
