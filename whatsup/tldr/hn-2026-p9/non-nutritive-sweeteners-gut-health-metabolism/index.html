rs-gut-health-metabolism\",\"href\":\"/whatsup/tldr/hn-2026-p9/non-nutritive-sweeteners-gut-health-metabolism\",\"category\":\"tldr\",\"title\":\"甜味剂扰乱肠道与代谢的新证据\",\"date\":\"2026-06-30\",\"excerpt\":\"一项新综述与荟萃分析整合21项成人随机试验，发现人工及其他低热量甜味剂可能升高空腹胰岛素与糖化血红蛋白，并借助肠道菌群机制影响代谢健康。\",\"coverImage\":\"$undefined\",\"author\":\"$undefined\",\"section\":\"whatsup\"},\"neighbors\":{\"previous\":{\"slug\":\"mitochondrial-decline-sedentary-healthy\",\"href\":\"/whatsup/tldr/hn-2026-p9/mitochondrial-decline-sedentary-healthy\",\"category\":\"tldr\",\"title\":\"健康久坐者细胞能量生产早期衰退\",\"date\":\"2026-06-30\",\"excerpt\":\"科罗拉多大学研究发现，每周运动不足150分钟的健康久坐者肌肉线粒体功能显著下降，燃糖燃脂效率降低，MPC1蛋白减少49%，研究者认为这种细胞衰退可能先于糖尿病等疾病出现。\",\"coverImage\":\"$undefined\",\"author\":\"David Kelly\",\"section\":\"whatsup\"},\"next\":{\"slug\":\"cern-lhc-long-shutdown-3-hilumi-upgrade\",\"href\":\"/whatsup/tldr/hn-2026-p9/cern-lhc-long-shutdown-3-hilumi-upgrade\",\"category\":\"tldr\",\"title\":\"大型强子对撞机谢幕与高亮度时代启程\",\"date\":\"2026-06-29\",\"excerpt\":\"大型强子对撞机结束最终物理运行，转入第三次长期停机，将拆除并更换1.2公里设备，全面升级为高亮度LHC，计划2030年投入运行。\",\"coverImage\":\"$undefined\",\"author\":\"$undefined\",\"section\":\"whatsup\"}},\"headings\":[{\"depth\":2,\"text\":\"摘要\",\"id\":\"摘要\"},{\"depth\":2,\"text\":\"内容框架与概述\",\"id\":\"内容框架与概述\"},{\"depth\":2,\"text\":\"核心概念及解读\",\"id\":\"核心概念及解读\"},{\"depth\":2,\"text\":\"原文信息\",\"id\":\"原文信息\"}],\"sidebar\":null,\"directoryHref\":\"/whatsup?tab=tldr\",\"isLongArticle\":false,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L18\"}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"摘要\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#摘要\",\"children\":\"摘要\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"塔夫茨大学研究团队在《当前动脉粥样硬化报告》发表综述与荟萃分析，整合21项成人随机对照试验，发现人工及低热量甜味剂相较水或安慰剂会升高空腹胰岛素与糖化血红蛋白，并呈胰岛素敏感性恶化趋势。机制上，甜味剂直接接触肠道微生物，可改变菌群组成与功能。大型观察性研究亦提示其与心血管代谢疾病风险升高相关。作者呼吁谨慎使用，并指出美国标签法规未要求标注甜味剂用量，阻碍了更确切的证据生成。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章由一项新发表的综述与荟萃分析切入，先给出核心结论：在21项成人随机对照试验中，以水或安慰剂为对照，人工及低热量甜味剂会升高空腹胰岛素和糖化血红蛋白，并呈现胰岛素敏感性恶化的趋势。作者强调，采用无热量对照的设计，使研究得以剥离替代热量带来的混杂，更直接地观察甜味剂本身的生理效应。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"随后文章转向机制解释，重点落在肠道微生物上。非营养性甜味剂大多不经消化而通过肠道，与菌群直接接触。所纳入的一项试验结合菌群图谱分析与人体菌群移植小鼠实验，显示某些低热量甜味剂能同时改变肠道菌群的组成与功能。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章进一步补充观察性研究的证据，指出其普遍发现甜味剂摄入与心血管代谢疾病风险升高相关。但作者也坦承此类研究存在局限：本身已具风险的人群可能更倾向选择这类产品，且不同甜味剂效应各异，合并分析会掩盖差异，因此需与临床试验结果合并解读。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"最后，作者给出实践建议与政策批评。在替代大量添加糖时甜味剂或许是较好选择，但不能默认其安全无害，尽量避免更为审慎。同时指出美国现行法规只要求列出甜味剂成分而非含量，使研究者难以准确评估摄入量，呼吁开展更多针对心血管代谢风险因素与机制通路的随机对照试验。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"非营养性甜味剂\"}],\"：指人工及低热量、零热量的代糖，曾被视为不参与代谢的惰性物质，如今证据显示并非如此。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"糖化血红蛋白\"}],\"：反映近两三个月平均血糖水平的指标，本研究中被甜味剂显著升高，提示长期血糖控制受损。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"空腹胰岛素与胰岛素敏感性\"}],\"：衡量机体血糖调节能力的核心指标，其升高与敏感性下降共同指向代谢功能受损。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"肠道微生物组\"}],\"：甜味剂不经消化直接接触的菌群群落，其组成与功能的改变被认为是代谢危害的可能机制。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"标签政策缺口\"}],\"：现行法规要求标注甜味剂种类却不要求标注用量，直接制约了人群层面摄入量的准确评估。\"]}],\"\\n\",[\"$\",\"hr\",null,{}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"原文信息\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#原文信息\",\"children\":\"原文信息\"}]}],\"\\n\",[\"$\",\"div\",null,{\"className\":\"my-8 overflow-x-auto border border-border shadow-sm\",\"children\":[\"$\",\"table\",null,{\"className\":\"w-full text-left border-collapse text-[14px] font-sans\",\"children\":[[\"$\",\"thead\",null,{\"className\":\"bg-placeholder/40 border-b border-accent/20\",\"children\":[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"字段\"}],[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"内容\"}]]}]}],[\"$\",\"tbody\",null,{\"className\":\"divide-y divide-border/50\",\"children\":[[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"原文\"}],[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":[\"$\",\"a\",null,{\"href\":\"https://now.tufts.edu/2026/06/30/growing-evidence-sugar-substitutes-disrupt-gut-health-and-metabolism\",\"children\":\"Growing Evidence That Sugar Substitutes Disrupt Gut Health and Metabolism\"}]}]]}],[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\
