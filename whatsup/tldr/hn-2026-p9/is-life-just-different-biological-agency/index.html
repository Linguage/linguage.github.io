al-agency\",\"href\":\"/whatsup/tldr/hn-2026-p9/is-life-just-different-biological-agency\",\"category\":\"tldr\",\"title\":\"生命只是与众不同吗：生物能动性之争\",\"date\":\"2026-07-08\",\"excerpt\":\"文章从伽利略号在太空探测到地球生命谈起，探讨生物能动性概念之争，追问生命是否因有目标与理由而区别于无机物，以及该概念能否成为有产出的科学议题。\",\"coverImage\":\"$undefined\",\"author\":\"Philip Ball\",\"section\":\"whatsup\"},\"neighbors\":{\"previous\":{\"slug\":\"linus-torvalds-development-lead-two-tools\",\"href\":\"/whatsup/tldr/hn-2026-p9/linus-torvalds-development-lead-two-tools\",\"category\":\"tldr\",\"title\":\"林纳斯自述不再是程序员：只用两个工具\",\"date\":\"2026-07-09\",\"excerpt\":\"林纳斯在开源峰会上谈论Linux稳步演进、AI带来的压力、淘汰过时硬件，以及他自认不再是程序员而是开发主管，日常只用Git和邮件两件工具。\",\"coverImage\":\"$undefined\",\"author\":\"Steven Vaughan-Nichols\",\"section\":\"whatsup\"},\"next\":{\"slug\":\"chatgpt-gemini-claude-architecture-forks\",\"href\":\"/whatsup/tldr/hn-2026-p9/chatgpt-gemini-claude-architecture-forks\",\"category\":\"tldr\",\"title\":\"架构分叉如何塑造三大模型的行为差异\",\"date\":\"2026-07-07\",\"excerpt\":\"从密度、多模态、上下文窗口与推理路由四个架构分叉点切入，解释ChatGPT、Gemini与Claude在相同提示下表现差异的根源，说明设计选择如何直接塑造用户可见的能力边界。\",\"coverImage\":\"$undefined\",\"author\":\"ByteByteGo\",\"section\":\"whatsup\"}},\"headings\":[{\"depth\":2,\"text\":\"摘要\",\"id\":\"摘要\"},{\"depth\":2,\"text\":\"内容框架与概述\",\"id\":\"内容框架与概述\"},{\"depth\":2,\"text\":\"核心概念及解读\",\"id\":\"核心概念及解读\"},{\"depth\":2,\"text\":\"原文信息\",\"id\":\"原文信息\"}],\"sidebar\":null,\"directoryHref\":\"/whatsup?tab=tldr\",\"isLongArticle\":false,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L18\"}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"摘要\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#摘要\",\"children\":\"摘要\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"1993年，研究者仅凭伽利略号探测器的遥感数据初步判断地球存在生命，引出生命为何不同于岩石与飓风的追问。文章聚焦生物能动性之争：米切尔等认为能动性是所有生命真实作用于世界的因果能力，奥卡沙视其为表型可塑性的华丽同义词，迪弗里斯科则称其为缺乏研究纲领的概念。作者意在评估这一概念能否成为有产出的科学议题。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章以萨根团队用伽利略号数据初步判断地球有生命开篇，提出生命与无机物的根本差异何在，并引出一种答案：生命为目标和理由而行动。仅用非平衡态与能量流描述生命并不够，因为飓风同样如此，却谈不上目标。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"作者随后指出，生命具有目标导向性本身并不争议，争议在于其含义。基因中心论视之为自动化程序的表演，但兔子逃窜时向左或向右的临场抉择难以归因于特定基因。由此引出能动性的操作性定义：设定近端目标并据此改造自身与环境。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"反对意见构成文章另一极。奥卡沙认为能动性往往只是行为可塑性的花哨说法，迪弗里斯科与高恩更称其既无新意又暗藏神秘的整体力量，类似十八世纪的活力论。苏丹与莫切克、沃尔什则回应，生物能动性并不超物质，是可检验的假说。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"作者最终自陈倾向认同能动性，因为它呼应了生命不只是基因程序的直觉，但同时警惕这一概念可能瓦解对生命机制的深入研究，故不急于褒贬，而是考察其科学产出性。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"生物能动性\"}],\"：生命体出于自身理由行动、并成为世界变化真实原因的能力，学界尚无统一定义。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"目的论\"}],\"：生命表现出的合目的性，是生物学与哲学长期纠结的难题，易滑向设计与活力论。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"表型可塑性\"}],\"：生物对同一刺激作出不同反应的能力，被批评者视为能动性的平凡替代解释。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"近端目标\"}],\"：非繁衍等终极目标，而是此刻该采取何种行动的即时判断，构成能动性的操作核心。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"活力论\"}],\"：十八世纪认为生命由某种特殊力量驱动的学说，被用作批评能动性含混的类比。\"]}],\"\\n\",[\"$\",\"hr\",null,{}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"原文信息\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#原文信息\",\"children\":\"原文信息\"}]}],\"\\n\",[\"$\",\"div\",null,{\"className\":\"my-8 overflow-x-auto border border-border shadow-sm\",\"children\":[\"$\",\"table\",null,{\"className\":\"w-full text-left border-collapse text-[14px] font-sans\",\"children\":[[\"$\",\"thead\",null,{\"className\":\"bg-placeholder/40 border-b border-accent/20\",\"children\":[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"字段\"}],[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"内容\"}]]}]}],[\"$\",\"tbody\",null,{\"className\":\"divide-y divide-border/50\",\"children\":[[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"原文\"}],[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":[\"$\",\"a\",null,{\"href\":\"https://www.quantamagazine.org/is-life-just-different-20260708/?mc_cid=8bb5409531\u0026mc_eid=9ed96560c1\",\"children\":\"Is Life Just Different?\"}]}]]}],[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"作者\"}],[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"Philip Ball\"}]]}],[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td
