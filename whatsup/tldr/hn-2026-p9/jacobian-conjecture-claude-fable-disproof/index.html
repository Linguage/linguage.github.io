映射反例，使雅可比猜想不再成立。该反例的雅可比行列式为常数负二，却把三个不同点映到同一点，可用代数软件验证。文章认为这标志AI从刷榜工具转向真正的研究协作者，但结论仍待同行评审。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章先交代事件本身。Alpöge在社交平台发布消息，把结果归功于Fable 5模型与朋友的随口提问，并指出这一自1884年两变量版本、1939年一般化以来长期悬置的猜想首次面临被否定。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"接着解释问题含义。多项式映射的雅可比行列式为非零常数，是否必然保证存在全局多项式逆？它曾进入Smale的世纪问题清单，而历年发表的证明屡被发现有误，学界因此形成高度谨慎的传统。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"随后给出反例细节。该三维映射的行列式为常数负二，但(0,0,-1/4)等三个点映到同一输出，与可逆性直接矛盾，维基百科数小时内更新，正式验证仍待同行评审。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"最后把此事放入2026年AI数学的脉络。DeepMind智能体解决埃尔德什开放问题、Lean形式化成为验证层，作者认为验证工具与数学库积累正形成飞轮，让AI数学从承诺变为常态新闻。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"雅可比猜想\"}],\"：若多项式映射的雅可比行列式为非零常数，则应存在多项式逆；如今被反例挑战。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"反例\"}],\"：满足猜想全部前提却不可逆的具体映射，三点映到同一点即可证明猜想不成立。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"Smale问题清单\"}],\"：1998年提出的下世纪重要数学问题列表，雅可比猜想与黎曼假设并列其中。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"Lean形式化验证\"}],\"：用证明助手把证明写成机器可检验的代码，正成为AI数学输出的验证层。\"]}],\"\\n\",[\"$\",\"p\",null,{\"clas
