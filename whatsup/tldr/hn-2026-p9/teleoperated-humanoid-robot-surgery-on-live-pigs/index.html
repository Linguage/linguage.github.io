h([1,"f:[\"$\",\"$L18\",null,{\"post\":{\"slug\":\"teleoperated-humanoid-robot-surgery-on-live-pigs\",\"href\":\"/whatsup/tldr/hn-2026-p9/teleoperated-humanoid-robot-surgery-on-live-pigs\",\"category\":\"tldr\",\"title\":\"人形机器人遥操作完成活体猪手术世界首例\",\"date\":\"2026-07-10\",\"excerpt\":\"加州大学圣迭戈分校团队用外科医生遥操作的人形机器人完成活体猪胆囊切除，属世界首例临床前试验，成本远低于传统专用手术机器人，但延迟与频繁校准仍限制临床可用性。\",\"coverImage\":\"$undefined\",\"author\":\"Jeremy Hsu\",\"section\":\"whatsup\"},\"neighbors\":{\"previous\":{\"slug\":\"social-media-fatigue-why-americans-stopped-posting\",\"href\":\"/whatsup/tldr/hn-2026-p9/social-media-fatigue-why-americans-stopped-posting\",\"category\":\"tldr\",\"title\":\"社交媒体倦怠：过半美国人不再发帖\",\"date\":\"2026-07-12\",\"excerpt\":\"Incogni 调查1000名美国人发现，社交媒体正从放松消遣变成心理负担，过半受访者发帖减少、对受众更挑剔，逾半数认为维持线上形象像在做工作，安全顾虑与政治内容成为退出的主要推力。\",\"coverImage\":\"$undefined\",\"author\":\"Neil J. Rubenking\",\"section\":\"whatsup\"},\"next\":{\"slug\":\"ai-slop-writing-social-media-study\",\"href\":\"/whatsup/tldr/hn-2026-p9/ai-slop-writing-social-media-study\",\"category\":\"tldr\",\"title\":\"四分之一长文由AI代笔：社交平台内容失守\",\"date\":\"2026-07-10\",\"excerpt\":\"Pangram 分析超百万条帖文发现，四分之一的长文社交媒体内容完全由 AI 生成，LinkedIn 与 X 最为严重，人类原创内容正在被大量稀释。\",\"coverImage\":\"$undefined\",\"author\":\"Brandon Vigliarolo\",\"section\":\"whatsup\"}},\"headings\":[{\"depth\":2,\"text\":\"摘要\",\"id\":\"摘要\"},{\"depth\":2,\"text\":\"内容框架与概述\",\"id\":\"内容框架与概述\"},{\"depth\":2,\"text\":\"核心概念及解读\",\"id\":\"核心概念及解读\"},{\"depth\":2,\"text\":\"原文信息\",\"id\":\"原文信息\"}],\"sidebar\":null,\"directoryHref\":\"/whatsup?tab=tldr\",\"isLongArticle\":false,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L19\"}]\n"])</script><script>self.__next_f.push([1,"19:[[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"摘要\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#摘要\",\"children\":\"摘要\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"加州大学圣迭戈分校研究人员用宇树G1人形机器人，由外科医生远程遥操作，为活体猪成功切除胆囊，属世界首例临床前试验，成果发表于自然杂志。该方案成本仅为专用手术机器人的零头，体积小易部署，适合偏远地区、战场乃至太空。但频繁重校准、数百毫秒延迟与有限臂展使手术耗时更长，完全自主化仍遥远。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章以世界首例活体猪遥操作手术切入，交代试验由加州大学圣迭戈分校完成并发表于自然杂志，点出核心主张：让缺乏昂贵设备的小型医院与诊所也能获得机器人辅助手术能力。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"接着进行成本与体积对比。宇树G1最低配约一万三千五百美元，加装灵巧手后可能超过六万七千美元，仍远低于动辄数百万美元的达芬奇系统；其六十磅体重与五英尺身高更适合偏远诊所。但达芬奇已获监管批准并历经多项临床试验，人形机器人尚处实验阶段。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"第三部分揭示技术瓶颈。团队需自制适配器与软件，把手部动作映射为器械运动，并借助立体头显与脚踏板控制。手术中多次暂停以重校准或调整体位，臂展仅四百五十毫米，延迟常达数百毫秒，高于理想的一百五十毫秒阈值，受训者用达芬奇操作也更快。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"结尾转向未来。研究团队希望打造能自主取械、清洁的自主手术助手，并强调远程与自主机器人可扩大重症手术可及性；但业界普遍认为通用自主机器人在人机安全协作方面仍有很长的路要走。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"遥操作手术\"}],\"：由人类外科医生远程控制机器人动作，机器人本身不做自主决策，属人机协作模式。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"宇树G1\"}],\"：中国宇树公司生产的人形机器人，高约五英尺、重六十磅，经改装后可夹持手术器械。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"达芬奇手术系统\"}],\"：直觉外科的专用手术机器人，成本数百万美元、重约一千八百磅，已获监管批准。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"延迟阈值\"}],\"：研究建议手术机器人延迟应低于一百五十毫秒，而现有人形系统常达数百毫秒。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"自主手术助手\"}],\"：能在医生身旁完成取械、清理等任务的机器人，是研究团队的远期目标。\"]}],\"\\n\",[\"$\",\"hr\",null,{}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"原文信息\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#原文信息\",\"children\":\"原文信息\"}]}],\"\\n\",[\"$\",\"div\",null,{\"className\":\"my-8 overflow-x-auto border border-border shadow-sm\",\"children\":[\"$\",\"table\",null,{\"className\":\"w-full text-left border-collapse text-[14px] font-sans\",\"children\":[[\"$\",\"thead\",null,{\"className\":\"bg-placeholder/40 border-b border-accent/20\",\"children\":[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"字段\"}],[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"内容\"}]]}]}],[\"$\",\"tbody\",null,{\"className\":\"divide-y divide-border/50\",\"children\":[[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"原文\"}],[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":[\"$\",\"a\",null,{\"href\":\"https://arstechnica.com/ai/2026/07/humanoid-robots-controlled-by-surgeons-did-world-first-operation-on-live-pigs/\",\"children\":\"Humanoid robots controlled by surgeons did world-first operation on live pigs\"}]}]]}],[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"作者\"}],[\"$\",\
