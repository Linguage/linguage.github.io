elf.__next_f.push([1,"f:[\"$\",\"$L18\",null,{\"post\":{\"slug\":\"claude-fable-5-jacobian-conjecture-counterexample\",\"href\":\"/whatsup/tldr/hn-2026-p9/claude-fable-5-jacobian-conjecture-counterexample\",\"category\":\"tldr\",\"title\":\"AI发现雅可比猜想八十七年反例\",\"date\":\"2026-07-21\",\"excerpt\":\"Anthropic 研究者借助 AI 模型 Claude Fable 5 找到困扰数学界 87 年的雅可比猜想的反例，并经 Lean 形式化验证，引发人类能否理解反例的追问。\",\"coverImage\":\"$undefined\",\"author\":\"$undefined\",\"section\":\"whatsup\"},\"neighbors\":{\"previous\":{\"slug\":\"jacobian-conjecture-for-baby\",\"href\":\"/whatsup/tldr/hn-2026-p9/jacobian-conjecture-for-baby\",\"category\":\"tldr\",\"title\":\"从零讲透雅可比猜想与它的八十七年\",\"date\":\"2026-07-22\",\"excerpt\":\"一篇面向零基础读者的科普长文，用图像与算术逐步讲清函数、逆映射、多项式与平面映射，引出悬置八十七年的雅可比猜想，并介绍2026年惊现的部分突破。\",\"coverImage\":\"$undefined\",\"author\":\"$undefined\",\"section\":\"whatsup\"},\"next\":{\"slug\":\"agi-hype-reflection-and-strategic-sovereignty\",\"href\":\"/whatsup/tldr/hn-2026-p9/agi-hype-reflection-and-strategic-sovereignty\",\"category\":\"tldr\",\"title\":\"朱松纯谈AI热潮反思与思想自主\",\"date\":\"2026-07-21\",\"excerpt\":\"朱松纯在2026世界人工智能大会思想者论坛的演讲整理，解构AI热潮背后的国际叙事、硅谷华尔街华盛顿三重奏与产业泡沫，主张回到智能的第一性原理，构建AGI的战略主动与中国叙事。\",\"coverImage\":\"$undefined\",\"author\":\"知识分子​\",\"section\":\"whatsup\"}},\"headings\":[{\"depth\":2,\"text\":\"摘要\",\"id\":\"摘要\"},{\"depth\":2,\"text\":\"内容框架与概述\",\"id\":\"内容框架与概述\"},{\"depth\":2,\"text\":\"核心概念及解读\",\"id\":\"核心概念及解读\"},{\"depth\":2,\"text\":\"原文信息\",\"id\":\"原文信息\"}],\"sidebar\":null,\"directoryHref\":\"/whatsup?tab=tldr\",\"isLongArticle\":false,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L19\"}]\n"])</script><script>self.__next_f.push([1,"19:[[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"摘要\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#摘要\",\"children\":\"摘要\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"Anthropic 数学家 Levent Alpoge 借助 Claude Fable 5 找到雅可比猜想反例，推翻这一悬置 87 年的命题：当变量数为三及以上时，雅可比行列式为非零常数并不能保证映射存在多项式逆映射。该结果已由研究者用 Lean 形式化验证并提交审查，但如何让人类理解反例成立的根本原因，成为新的挑战。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章先铺垫数学背景：多变量函数的逆映射能否在全空间唯一还原输入，可由雅可比行列式判断。若它为非零常数，则局部处处可逆；猜想追问这是否足以推出全空间存在多项式逆映射，自 1939 年提出以来屡有错误证明。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"接着叙述事件本身。在数学家 Akil Matthew 建议下，Alpoge 让 Fable 5 求解，模型给出一个多项式映射，其雅可比行列式恒为 -2，却有三个不同输入映射到同一输出，从而证伪三变量及以上的猜想。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"随后文章强调验证的重要性。AI 生成的公式并不天然可信，展开或代入的微小错误即可推翻结论，因此论文发表后由 Rouzeau 用定理证明系统 Lean 重写，并提交至 DeepMind 维护的形式化猜想仓库，目前处于审查中。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"最后引述形式化数学项目 Xena 的观点：下一阶段的难题不只是确认反例正确，而是人类如何理解反例为何成立，指向 AI 与数学共同体关系的新命题。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"雅可比猜想\"}],\"：1939 年 Keller 提出，问雅可比行列式为非零常数的多项式映射是否必有多项式逆映射。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"雅可比行列式\"}],\"：在每个输入点计算的线性近似，衡量局部是否丢失方向信息，非零即局部可逆。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"单射与逆映射\"}],\"：不同输入对应同一输出则映射非单射，全空间意义下无法唯一还原输入。\"]}],\"\\n\",[\"$\",\"p\",null,{\"clas
