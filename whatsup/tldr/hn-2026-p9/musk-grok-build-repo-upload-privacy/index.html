d-repo-upload-privacy\",\"href\":\"/whatsup/tldr/hn-2026-p9/musk-grok-build-repo-upload-privacy\",\"category\":\"tldr\",\"title\":\"马斯克承诺删库 应对Grok Build整仓上传风波\",\"date\":\"2026-07-14\",\"excerpt\":\"AI安全研究者发现Grok Build会把用户整个代码仓库连同Git历史上传云端，事件曝光后官方仅靠服务端开关止损，马斯克承诺彻底删除已上传数据。\",\"coverImage\":\"$undefined\",\"author\":\"Connor Jones\",\"section\":\"whatsup\"},\"neighbors\":{\"previous\":{\"slug\":\"roman-concrete-durability-carbonation-latrine\",\"href\":\"/whatsup/tldr/hn-2026-p9/roman-concrete-durability-carbonation-latrine\",\"category\":\"tldr\",\"title\":\"罗马混凝土千年不倒的碳化之谜\",\"date\":\"2026-07-14\",\"excerpt\":\"新研究从哈德良别墅一座1900年前的厕所混凝土取样，发现除火山灰反应外，长期碳化生成的方解石也是关键粘结物，能自动封堵裂缝，为低碳水泥研发提供线索。\",\"coverImage\":\"$undefined\",\"author\":\"Sara Hashemi\",\"section\":\"whatsup\"},\"next\":{\"slug\":\"fastest-way-to-multiply-numbers\",\"href\":\"/whatsup/tldr/hn-2026-p9/fastest-way-to-multiply-numbers\",\"category\":\"tldr\",\"title\":\"数学家仍未找到最快的乘法算法\",\"date\":\"2026-07-13\",\"excerpt\":\"从小学竖式乘法到1960年23岁学生的惊人突破，讲述乘法算法复杂度这一关乎加密与人工智能的核心谜题为何至今未解\",\"coverImage\":\"$undefined\",\"author\":\"Jack Murtagh\",\"section\":\"whatsup\"}},\"headings\":[{\"depth\":2,\"text\":\"摘要\",\"id\":\"摘要\"},{\"depth\":2,\"text\":\"内容框架与概述\",\"id\":\"内容框架与概述\"},{\"depth\":2,\"text\":\"核心概念及解读\",\"id\":\"核心概念及解读\"},{\"depth\":2,\"text\":\"原文信息\",\"id\":\"原文信息\"}],\"sidebar\":null,\"directoryHref\":\"/whatsup?tab=tldr\",\"isLongArticle\":false,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L18\"}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"摘要\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#摘要\",\"children\":\"摘要\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"AI安全研究者Cereblab披露，xAI旗下命令行工具Grok Build在读取文件时会把内容未经脱敏地送往云端存储，甚至将整个代码仓库打包上传，即使用户明确要求它不要打开任何文件。事件发酵后xAI通过服务端开关停止上传，马斯克承诺彻底删除此前数据，但研究者指出真正起效的并非官方推荐的/privacy命令。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章先以研究者报告为切口，还原问题本身：Grok Build 不仅在读文件时上传原文，还会把整个仓库打成 Git bundle 传走，保留数月前已删除的历史密钥。一个只要求回复 OK 且禁止打开文件的测试提示，仍然触发了全仓上传，实证性很强。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"接着写事件的公共反应与官方回应。其他用户随后报告了更严重的案例，包括整个用户目录连同 SSH 密钥与密码库被打开上传。xAI 高管与马斯克相继发声，强调零数据保留策略、提供 /privacy 命令，并承诺删除存量数据。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"最后是研究者与厂商对补救措施的定性分歧。Cereblab 确认上传已停止，但指出真正起作用的是一个静默的服务端全局开关，与用户是否选择退出无关；把 /privacy 当作解决方案会误导开发者，正确默认值应是关闭。文章由此把个案上升为对工具默认权限与数据保留边界的追问。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"整仓上传\"}],\"：工具将完整代码仓库及 Git 历史打包传输，而非仅上传回答所需文件，泄露面被显著放大。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"零数据保留 ZDR\"}],\"：企业级隐私选项，开启后不留存代码与痕迹数据，但需用户主动启用而非默认。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"/privacy 命令\"}],\"：按会话生效的保留开关，研究者认为它并非修复本次问题的机制，不应被当作控制手段。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"静默全局开关\"}],\"：服务端下发的 disable_codebase_upload 标志，对所有用户强制生效，才是上传停止的真实原因。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"默认即关闭\"}],\"：安全设计原则，主张隐私与数据外发应默认关闭，而非让开发者每次会话手动退出。\"]}],\"\\n\",[\"$\",\"hr\",null,{}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"原文信息\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#原文信息\",\"children\":\"原文信息\"}]}],\"\\n\",[\"$\",\"div\",null,{\"className\":\"my-8 overflow-x-auto border border-border shadow-sm\",\"children\":[\"$\",\"table\",null,{\"className\":\"w-full text-left border-collapse text-[14px] font-sans\",\"children\":[[\"$\",\"thead\",null,{\"className\":\"bg-placeholder/40 border-b border-accent/20\",\"children\":[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"字段\"}],[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"内容\"}]]}]}],[\"$\",\"tbody\",null,{\"className\":\"divide-y divide-border/50\",\"children\":[[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"原文\"}],[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":[\"$\",\"a\",null,{\"href\":\"https://www.theregister.com/ai-and-ml/2026/07/14/musk-promises-purge-after-grok-build-caught-sending-entire-repos-to-the-cloud/5271123\",\"children\":\"Musk promises purge after Grok Build caught sending entire repos to the cloud\"}]}]]}],[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"作者\"}],[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"Connor Jones\"}]]}],[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"childre
