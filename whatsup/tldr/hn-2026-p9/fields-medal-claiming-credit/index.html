奖之后的攀亲与反思\",\"date\":\"2026-07-26\",\"excerpt\":\"借王虹与邓煜获菲尔兹奖一事，批评成名后众人攀亲认领关系的刻奇现象，并反思中国基础教育擅长训练却难以容纳原创研究者的结构性缺陷。\",\"coverImage\":\"$undefined\",\"author\":\"$undefined\",\"section\":\"whatsup\"},\"neighbors\":{\"previous\":{\"slug\":\"anthropic-position-on-open-weights-models\",\"href\":\"/whatsup/tldr/hn-2026-p9/anthropic-position-on-open-weights-models\",\"category\":\"tldr\",\"title\":\"Anthropic 对开放权重模型的立场与主张\",\"date\":\"2026-07-28\",\"excerpt\":\"Anthropic CEO Dario Amodei 澄清公司从未主张禁止开放权重模型，提出芯片管制、打击蒸馏与强制安全测试三项替代方案，回应国家安全与滥用风险。\",\"coverImage\":\"$undefined\",\"author\":\"$undefined\",\"section\":\"whatsup\"},\"next\":{\"slug\":\"wang-hong-fields-medal-profile\",\"href\":\"/whatsup/tldr/hn-2026-p9/wang-hong-fields-medal-profile\",\"category\":\"tldr\",\"title\":\"从北大数学系小透明到菲尔兹奖得主王虹专访\",\"date\":\"2026-07-24\",\"excerpt\":\"中国数学家王虹获2026年菲尔兹奖，成为首位中国籍女性得主。专访回溯她从北大转系的小透明到证明三维挂谷猜想的求索历程，展现热爱、挫败与坚持的力量。\",\"coverImage\":\"$undefined\",\"author\":\"$undefined\",\"section\":\"whatsup\"}},\"headings\":[{\"depth\":2,\"text\":\"摘要\",\"id\":\"摘要\"},{\"depth\":2,\"text\":\"内容框架与概述\",\"id\":\"内容框架与概述\"},{\"depth\":2,\"text\":\"核心概念及解读\",\"id\":\"核心概念及解读\"},{\"depth\":2,\"text\":\"原文信息\",\"id\":\"原文信息\"}],\"sidebar\":null,\"directoryHref\":\"/whatsup?tab=tldr\",\"isLongArticle\":false,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L18\"}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"摘要\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#摘要\",\"children\":\"摘要\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章从王虹和邓煜获菲尔兹奖切入，批评舆论与机构在成名后争相追溯师承、翻查选课记录的攀亲式祝贺，指出数学本身被关系和归属取代。作者进而反思中国基础教育擅长确定性训练，却难以识别与容纳原创研究者，并以收割一词概括系统在人才未成功时忽视、成功后索取的逻辑。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章先肯定两位数学家成果的分量与中国基础教育的贡献，随即转向批评。作者指出，获奖公布后的直播与舆论几乎不谈三维挂谷猜想难在何处，只反复追溯谁教过、谁认识、谁的课上考得好，祝贺由此变成攀亲，学术变成族谱。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"接着文章剖析这种风气背后的教育结构问题：考试面对确定性，研究面对不确定性，前者中国教育极其擅长，后者需要允许迟疑、绕路与失败的土壤。作者以王虹转系、赴法、遇导师Larry Guth的经历，说明被学生当作形成中的研究者与被当作标准化产品之间的根本差别。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"随后文章将批评推进到科研生态：问题常由风口、项目与政策驱动，短周期强考核会系统消灭真正原创的选择；导师一端把学生当工具，另一端完全放养把学生当彩票，本质都未把学生当作需要认真培养的人。结尾提出，真正值得追问的不是如何请回已成名的王虹，而是如何让尚未成功、成绩不耀眼的王虹在此地就被耐心看见。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"攀亲式祝贺\"}],\"：成名后各方翻查通讯录与选课记录，把机构、课程、师承都包装成奖牌的共同缔造者。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"确定性训练与不确定性研究\"}],\"：前者追求有答案、比速度；后者要在无标准答案处发现问题并忍受漫长失败。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"收割式培养\"}],\"：年轻未成时系统要求其自证配得上资源，成功不再需要资源时，系统又要求其回来证明系统的成功。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"标准化产品与研究者的分野\"}],\"：核心不在轻松或刻苦教育，而在把学生当待验收产品，还是当正在形成的研究者。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"问题驱动与风口驱动\"}],\"：真正原创的选题起初常显无用、不热门，而短周期考核会系统性逼退这类选择。\"]}],\"\\n\",[\"$\",\"hr\",null,{}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[
