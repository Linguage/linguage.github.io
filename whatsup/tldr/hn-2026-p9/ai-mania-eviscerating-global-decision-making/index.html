\":\"#摘要\",\"children\":\"摘要\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"作者以自身在销售与技术一线的观察指出，所接触的AI项目一年半内成功率为零，多数失败源于企业本身糟糕的项目能力，而非AI技术。更严重的是，企业内部已将信仰式表态当作晋升与留任的前提，质疑者被边缘化甚至解雇。真正危险的不是技术泡沫，而是组织因此丧失了评估现实与做出理性决策的能力。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章先立论：掌权者要么没有计划，要么只能低头自保，公共与私营机构普遍陷入一种集体狂热，理性讨论的空间正在消失。作者的特殊位置使其无需靠迎合 madness 谋生，因此试图描述这种动态并安慰仍在其中挣扎的人。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"接着用事实层面拆解AI投资。作者称一年半内观察到的AI项目无一成功，内部聊天机器人乏人使用，客服机器人看似流畅实则把请求丢进虚空，而项目方刻意回避可被验证的使用率指标，公开宣称的生产力提升多属不实。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"随后转向制度层面：在五百人以上企业中，晋升与留任日益依赖于对AI变革力的信仰告白，而非技术判断。作者举出高管从没用过任何AI工具却制定以AI为核心的二十亿美元级战略，以及有人解雇不用LLM的高绩效员工，说明真信者比撒谎者更难对付。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"最后落点是决策能力的崩坏。当质疑等同于攻击指挥链，组织便无法在危机显现前纠偏，作者因此建议同行干脆不要询问任何在建AI项目的进展，因为那时已无可行干预手段。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"AI狂热\"}],\"：一种类似宗教的组织氛围，成员以信仰告白替代技术判断与成效验证。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"信仰告白\"}],\"：非技术背景者反复宣称AI正在改变一切，用以换取晋升与留任的资格。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"零成功率观察\"}],\"：作者团队一年半内所见AI项目无一成功，且失败常与AI本身无关。\"]}],\"\\n\",[
