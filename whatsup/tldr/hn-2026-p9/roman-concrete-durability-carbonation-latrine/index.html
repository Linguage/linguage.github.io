crete-durability-carbonation-latrine\",\"href\":\"/whatsup/tldr/hn-2026-p9/roman-concrete-durability-carbonation-latrine\",\"category\":\"tldr\",\"title\":\"罗马混凝土千年不倒的碳化之谜\",\"date\":\"2026-07-14\",\"excerpt\":\"新研究从哈德良别墅一座1900年前的厕所混凝土取样，发现除火山灰反应外，长期碳化生成的方解石也是关键粘结物，能自动封堵裂缝，为低碳水泥研发提供线索。\",\"coverImage\":\"$undefined\",\"author\":\"Sara Hashemi\",\"section\":\"whatsup\"},\"neighbors\":{\"previous\":{\"slug\":\"formal-verification-lean-otp-tutorial\",\"href\":\"/whatsup/tldr/hn-2026-p9/formal-verification-lean-otp-tutorial\",\"category\":\"tldr\",\"title\":\"用 Lean 形式化验证一次性密码本入门\",\"date\":\"2026-07-15\",\"excerpt\":\"面向密码学工程师的 Lean 4 形式化验证入门教程第一部分，讲解如何用 Lean 定义比特串与异或，并逐步形式化验证一次性密码本的正确性。\",\"coverImage\":\"$undefined\",\"author\":\"$undefined\",\"section\":\"whatsup\"},\"next\":{\"slug\":\"musk-grok-build-repo-upload-privacy\",\"href\":\"/whatsup/tldr/hn-2026-p9/musk-grok-build-repo-upload-privacy\",\"category\":\"tldr\",\"title\":\"马斯克承诺删库 应对Grok Build整仓上传风波\",\"date\":\"2026-07-14\",\"excerpt\":\"AI安全研究者发现Grok Build会把用户整个代码仓库连同Git历史上传云端，事件曝光后官方仅靠服务端开关止损，马斯克承诺彻底删除已上传数据。\",\"coverImage\":\"$undefined\",\"author\":\"Connor Jones\",\"section\":\"whatsup\"}},\"headings\":[{\"depth\":2,\"text\":\"摘要\",\"id\":\"摘要\"},{\"depth\":2,\"text\":\"内容框架与概述\",\"id\":\"内容框架与概述\"},{\"depth\":2,\"text\":\"核心概念及解读\",\"id\":\"核心概念及解读\"},{\"depth\":2,\"text\":\"原文信息\",\"id\":\"原文信息\"}],\"sidebar\":null,\"directoryHref\":\"/whatsup?tab=tldr\",\"isLongArticle\":false,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L18\"}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"摘要\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#摘要\",\"children\":\"摘要\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"科学家长期认为罗马混凝土的耐久性源于火山灰与石灰、水的火山灰反应。最新发表于Science Advances的研究从哈德良别墅一座1900年前的厕所取样，发现大气二氧化碳与混凝土中钙化合物生成的方解石才是主要粘结物，可填充孔隙与裂缝，使结构随岁月自我修复。这一发现为降低现代水泥碳排放提供了新思路。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章以古今对比切入：现代混凝土通常约百年即损毁，而罗马的道路、渡槽与建筑屹立近两千年，耐久性之谜长期困扰学界，过去普遍归因于火山灰反应。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"研究者选择哈德良别墅的公共厕所作为样本，理由是厕所从无人修复，材料在十九个世纪里未曾受现代干预，等于一场无人能复制的天然实验。他们借助高倍显微镜、X射线与化学成分分析展开检测。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"结果表明，除火山灰反应外，长期碳化形成的方解石构成主要粘结相，能封堵微孔与裂隙并促成自愈。这一结论延续并深化了2023年关于生石灰遗留钙质沉积可自修复裂缝的研究，使碳酸盐从边缘角色走向核心。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文末转向现实意义：水泥生产约占全球碳排放的百分之八，而2050年前仍有大量建筑尚未建成，理解古法有助于开发更低碳、更耐久的建筑材料。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"碳化反应\"}],\"：大气二氧化碳与混凝土中钙化合物反应生成碳酸钙，长期累积可封堵裂缝并增强耐久性。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"火山灰反应\"}],\"：火山灰与石灰、水发生反应生成胶凝物质，是学界公认的罗马混凝土强度来源。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"方解石\"}],\"：含钙、碳、氧的矿物，在本研究样本中充当主要粘结物，是自愈能力的物质基础。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"自愈混凝土\"}],\"：材料内部钙质沉积遇水重结晶，自动填补裂缝，使古罗马结构随时间强化。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"哈德良别墅\"}],\"：罗马皇帝哈德良于蒂沃利的庞大庄园，其未修复的厕所提供了原始状态的混凝土样本。\"]}],\"\\n\",[\"$\",\"hr\",null,{}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"原文信息\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#原文信息\",\"children\":\"原文信息\"}]}],\"\\n\",[\"$\",\"div\",null,{\"className\":\"my-8 overflow-x-auto border border-border shadow-sm\",\"children\":[\"$\",\"table\",null,{\"className\":\"w-full text-left border-collapse text-[14px] font-sans\",\"children\":[[\"$\",\"thead\",null,{\"className\":\"bg-placeholder/40 border-b border-accent/20\",\"children\":[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"字段\"}],[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"内容\"}]]}]}],[\"$\",\"tbody\",null,{\"className\":\"divide-y divide-border/50\",\"children\":[[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"原文\"}],[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":[\"$\",\"a\",null,{\"href\":\"https://www.smithsonianmag.com/smart-news/how-has-roman-concrete-lasted-for-millennia-a-1900-year-old-latrine-offers-new-clues-about-the-materials-impressive-durability-180989115/\",\"children\":\"How Has Roman Concrete Lasted for Millennia? A 1,900-Year-Old Latrine Offers New Clues About the Materials Impressive Durability\"}]}]]}],[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"作者\"}],[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\
