aka-resolution-of-singularities\",\"href\":\"/whatsup/tldr/hn-2026-p9/heisuke-hironaka-resolution-of-singularities\",\"category\":\"tldr\",\"title\":\"广中平祐与奇点消解的一生\",\"date\":\"2026-08-28\",\"excerpt\":\"代数几何学家广中平祐以1964年任意维度奇点消解证明闻名，获1970年菲尔兹奖，其成果成为数学各领域的标准工具，本文回顾其生平、师承与提携后学的教育理念。\",\"coverImage\":\"$undefined\",\"author\":\"Allyn Jackson\",\"section\":\"whatsup\"},\"neighbors\":{\"previous\":{\"slug\":\"care-for-a-little-more-ai\",\"href\":\"/whatsup/tldr/hn-2026-p9/care-for-a-little-more-ai\",\"category\":\"tldr\",\"title\":\"AI碾压猜想之后数学何去何从\",\"date\":\"2026-08-30\",\"excerpt\":\"菲尔兹奖得主Hugo Duminil-Copin以渗流理论著名猜想为例，反思生成式AI对数学的直接冲击：AI或将抢先完成核心证明，使尚未成熟的研究领域被提前斩首，并侵蚀以过程与理解为本的数学文化与年轻学者的成长路径。\",\"coverImage\":\"$undefined\",\"author\":\"$undefined\",\"section\":\"whatsup\"},\"next\":{\"slug\":\"ai-agents-audit-scientific-literature\",\"href\":\"/whatsup/tldr/hn-2026-p9/ai-agents-audit-scientific-literature\",\"category\":\"tldr\",\"title\":\"AI智能体审查文献发现陈旧错误\",\"date\":\"2026-08-06\",\"excerpt\":\"化学家用AI预测沸点时发现使用了75年的参考数据库存在错误，研究者进一步用AI智能体核查顶会论文的可复现性与错误率，同时提醒这类查错工具会误报漏判，最终判断仍须人工监督\",\"coverImage\":\"$undefined\",\"author\":\"Chris Stokel-Walker\",\"section\":\"whatsup\"}},\"headings\":[{\"depth\":2,\"text\":\"摘要\",\"id\":\"摘要\"},{\"depth\":2,\"text\":\"内容框架与概述\",\"id\":\"内容框架与概述\"},{\"depth\":2,\"text\":\"核心概念及解读\",\"id\":\"核心概念及解读\"},{\"depth\":2,\"text\":\"原文信息\",\"id\":\"原文信息\"}],\"sidebar\":null,\"directoryHref\":\"/whatsup?tab=tldr\",\"isLongArticle\":false,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L18\"}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"摘要\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#摘要\",\"children\":\"摘要\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"代数几何学家广中平祐于94岁辞世，他1964年证明任意维度的奇点消解，为尖点、自交等复杂几何现象提供统一化简方法，成为数学各领域的标准工具，1970年获菲尔兹奖。文章追述其成长、师承扎里斯基与格罗滕迪克，以及他扶植青年、主张坚持即创造的人生观。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章以讣告开篇，直接点明广中平祐1964年奇点消解证明的分量，格罗滕迪克称其为数学史上最难最宏伟的证明之一，1970年菲尔兹奖为其加冕。随后转入生平：他生于山口县，是十五个孩子之一，广岛遭原爆时因百公里之隔而幸免；京都大学时期沉迷代数却觉其过于抽象，1956年扎里斯基到访，让他看到代数与几何结合的可能，遂赴哈佛并于1960年获博士学位。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"接着文章解释数学本身：以多项式方程组的解集即代数簇为起点，用叶缘尖点、签名笔触等日常比喻说明奇点，又以过山车与其投影在地面的影子作喻，说明带奇点的低维曲线可以表示为高维光滑对象的影子，据此阐明消解的含义。扎里斯基已解决低维情形，广中平祐把结论推广到任意维度。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"最后落在人格与传承：他创办日本数学科学协会资助学生出国，为中学生与大学生办研讨班，自传《学习的快乐》强调坚持是创造与智慧的钥匙。文章以他的两只手之喻收束，一手握无限，一手握有限真实世界，数学家的任务是连接二者。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"奇点消解\"}],\"：把带尖点、自交等复杂几何对象表示为高维光滑对象的投影，从而化繁为简。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"代数簇\"}],\"：一族多项式方程全部解的集合，可视作几何对象，或光滑或带奇点。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"格罗布纳基\"}],\"：广中平祐在证明过程中建立了相关理论中的许多内容；这类特殊多项式组可用于算法化求解。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"菲尔兹奖\"}],\"：1970年授予广中平祐，表彰其在奇点消解问题上的里程碑工作。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"无限与有限\"}],\"：他以两只手作喻，认为数学家的职责是连接无限与真实世界。\"]}],\"\\n\",[\"$\",\"hr\",null,{}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"原文信息\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#原文信息\",\"children\":\"原文信息\"}]}],\"\\n\",[\"$\",\"div\",null,{\"className\":\"my-8 overflow-x-auto border border-border shadow-sm\",\"children\":[\"$\",\"table\",null,{\"className\":\"w-full text-left border-collapse text-[14px] font-sans\",\"children\":[[\"$\",\"thead\",null,{\"className\":\"bg-placeholder/40 border-b border-accent/20\",\"children\":[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"字段\"}],[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"内容\"}]]}]}],[\"$\",\"tbody\",null,{\"className\":\"divide-y divide-border/50\",\"children\":[[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"原文\"}],[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":[\"$\",\"a\",null,{\"href\":\"https://www.nature.com/articles/d41586-026-02688-x?utm_source=x\u0026utm_medium=social\u0026utm_campaign=nature\u0026linkId=63453324\",\"children\":\"Heisuke Hironaka obituary: mathematician who smoothed out geometrys complexities\"}]}]]}],[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"作者\"}],[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"Allyn Jackson\"}]]}],[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\"
