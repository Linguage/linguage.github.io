([1,"f:[\"$\",\"$L18\",null,{\"post\":{\"slug\":\"mars-perseverance-macromolecular-carbon-bright-angel\",\"href\":\"/whatsup/tldr/hn-2026-p9/mars-perseverance-macromolecular-carbon-bright-angel\",\"category\":\"tldr\",\"title\":\"火星岩石表面的神秘大分子碳\",\"date\":\"2026-07-04\",\"excerpt\":\"毅力号在火星耶泽罗陨石坑外的亮天天使露头，首次在岩石表面直接探测到复杂大分子碳，光谱特征近似地球干酪根，但生物或非生物成因仍无法判定，需样本返回地球才能解答。\",\"coverImage\":\"$undefined\",\"author\":\"Jacek Krywko\",\"section\":\"whatsup\"},\"neighbors\":{\"previous\":{\"slug\":\"flathub-anti-llm-submission-abandonment-study\",\"href\":\"/whatsup/tldr/hn-2026-p9/flathub-anti-llm-submission-abandonment-study\",\"category\":\"tldr\",\"title\":\"反人工智能提交政策下的开源维护困境\",\"date\":\"2026-07-05\",\"excerpt\":\"作者借Flathub禁止大模型生成提交的政策，手动统计被标注为AI Slop的120个仓库，发现其中88个已停止维护，并借此讨论志愿评审负担、提交者学习缺失与开源可持续性问题。\",\"coverImage\":\"$undefined\",\"author\":\"$undefined\",\"section\":\"whatsup\"},\"next\":{\"slug\":\"evolutionary-mismatch-modern-life-mental-health\",\"href\":\"/whatsup/tldr/hn-2026-p9/evolutionary-mismatch-modern-life-mental-health\",\"category\":\"tldr\",\"title\":\"进化失配：现代生活为何超出人类心智负荷\",\"date\":\"2026-07-03\",\"excerpt\":\"新加坡科技设计大学与詹姆斯库克大学学者提出进化失配理论，认为人类为小群体进化出的本能面对城市、社媒与持续比较时产生错位，或可解释当代压力、孤独与幸福感下降。\",\"coverImage\":\"$undefined\",\"author\":\"$undefined\",\"section\":\"whatsup\"}},\"headings\":[{\"depth\":2,\"text\":\"摘要\",\"id\":\"摘要\"},{\"depth\":2,\"text\":\"内容框架与概述\",\"id\":\"内容框架与概述\"},{\"depth\":2,\"text\":\"核心概念及解读\",\"id\":\"核心概念及解读\"},{\"depth\":2,\"text\":\"原文信息\",\"id\":\"原文信息\"}],\"sidebar\":null,\"directoryHref\":\"/whatsup?tab=tldr\",\"isLongArticle\":false,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L19\"}]\n"])</script><script>self.__next_f.push([1,"19:[[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"摘要\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#摘要\",\"children\":\"摘要\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"NASA毅力号火星车在耶泽罗陨石坑外的亮天天使露头，用SHERLOC紫外拉曼光谱仪首次在未经钻磨的岩石表面直接探测到复杂大分子碳，其G带信号近似地球干酪根。研究团队排除了仪器伪影与地球污染两种可能，并发现碳可能经两次地质事件就位。但火星车载荷无法区分生物与非生物成因，答案仍需等待样本返回地球。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章先抛出核心发现：毅力号五年来首次在岩石表面而非钻孔内部探测到大分子碳，这是迄今火星表面最浅的有机物探测记录。作者随即点出关键张力，地球上如此规模的碳通常指向生物来源，但此处无法下此定论。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"接着文章展开科学界的两大质疑。一是信号可能来自SHERLOC自身窗口的光学伪影，团队通过实验室备用光学件、火星定标靶与对照岩石逐一排除；二是地球污染嫌疑，作者以灭菌钻头、未接触硬件的岩石及对照样本证明信号真实。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"第三部分转向化学语境，碳在阿波罗神庙与瓦哈拉林间空地分别伴生碳酸盐硫酸盐与硅酸盐沉积，暗示至少两次就位事件。文章最终落回未解之问：火星车仪器并非为判别生命而设计，同位素、手性与显微化石等关键证据只能留待样本回到地球。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"SHERLOC\"}],\"：毅力号机械臂上的紫外拉曼光谱仪，通过激光散射能量位移识别分子键，本文发现的主要工具。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"大分子碳\"}],\"：交联网络状的还原碳，耐化学与热分解；该词只表明成因未知，不含生物暗示。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"G带\"}],\"：石墨带光谱信号，指示复杂有机碳结构存在，是本次判定的核心证据。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"干酪根\"}],\"：地球沉积岩中几乎专由生物遗骸形成的有机质，作者刻意回避此词以免误导。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"手性\"}],\"：分子左右手偏好性，与生物成因强相关，是样本返回后待测的关键指标之一。\"]}],\"\\n\",[\"$\",\"hr\",null,{}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"原文信息\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#原文信息\",\"children\":\"原文信息\"}]}],\"\\n\",[\"$\",\"div\",null,{\"className\":\"my-8 overflow-x-auto border border-border shadow-sm\",\"children\":[\"$\",\"table\",null,{\"className\":\"w-full text-left border-collapse text-[14px] font-sans\",\"children\":[[\"$\",\"thead\",null,{\"className\":\"bg-placeholder/40 border-b border-accent/20\",\"children\":[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"字段\"}],[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"内容\"}]]}]}],[\"$\",\"tbody\",null,{\"className\":\"divide-y divide-border/50\",\"children\":[[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"原文\"}],[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":[\"$\",\"a\",null,{\"href\":\"https://arstechnica.com/science/2026/07/a-martian-rock-has-lots-of-carbon-on-it-and-its-not-clear-why/?comments-page=1\",\"children\":\"A martian rock has lots of carbon on it, and its not clear why\"}]}]]}],[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"作者\"}],[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"Jacek Krywko\"}]]}],[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-
