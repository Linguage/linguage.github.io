ic-method-ramsey-upgrade\",\"category\":\"tldr\",\"title\":\"八十年后数学家为埃尔德什概率方法升级\",\"date\":\"2026-06-26\",\"excerpt\":\"八十年后，数学家借助高维球面几何改造埃尔德什的概率方法，改进了长期停滞的近对角拉姆齐数下界。\",\"coverImage\":\"$undefined\",\"author\":\"Leila Sloman\",\"section\":\"whatsup\"},\"neighbors\":{\"previous\":{\"slug\":\"unreasonable-difficulty-time-series-forecasting\",\"href\":\"/whatsup/tldr/hn-2026-p9/unreasonable-difficulty-time-series-forecasting\",\"category\":\"tldr\",\"title\":\"时间序列预测为何如此困难\",\"date\":\"2026-06-27\",\"excerpt\":\"作者通过大规模基准测试发现，无论统计模型、神经网络还是大语言模型，在时间序列预测上都难敌朴素基线，由此剖析预测任务区别于普通序列学习的根本难点。\",\"coverImage\":\"$undefined\",\"author\":\"$undefined\",\"section\":\"whatsup\"},\"next\":{\"slug\":\"lean-formal-verification-math-ai\",\"href\":\"/whatsup/tldr/hn-2026-p9/lean-formal-verification-math-ai\",\"category\":\"tldr\",\"title\":\"押上职业生涯：Lean 如何改写数学\",\"date\":\"2026-06-24\",\"excerpt\":\"讲述微软研究院的 Lean 定理证明器如何从无人问津的软件工具，成长为数学家群体与 AI 校验数学证明的核心基础设施，并追问机器核查能否替代人类的数学判断。\",\"coverImage\":\"$undefined\",\"author\":\"Breaking Math\",\"section\":\"whatsup\"}},\"headings\":[{\"depth\":2,\"text\":\"摘要\",\"id\":\"摘要\"},{\"depth\":2,\"text\":\"内容框架与概述\",\"id\":\"内容框架与概述\"},{\"depth\":2,\"text\":\"核心概念及解读\",\"id\":\"核心概念及解读\"},{\"depth\":2,\"text\":\"原文信息\",\"id\":\"原文信息\"}],\"sidebar\":null,\"directoryHref\":\"/whatsup?tab=tldr\",\"isLongArticle\":false,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L18\"}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"摘要\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#摘要\",\"children\":\"摘要\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"1947年埃尔德什提出概率方法，用随机性证明满足条件的图必然存在，却无法给出具体构造。此后八十年，对角拉姆齐数的下界几乎停滞。清华研究生沈维杰联合同行，借助高维球面几何建立相关性染色模型，按节点间距离决定边色，改进了近对角拉姆齐数的下界，并可能反哺图论其他问题。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章从埃尔德什1947年的概率方法讲起：他不构造具体对象，只证明随机取一个图时命中目标的概率大于零，由此推出拉姆齐数下界。方法仅数行，却颠覆了必须有实例的旧观念，后来成为离散数学与计算机科学的通用工具。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"接着交代问题的难点。单色团是禁止出现的结构，图足够大时无论如何染色都躲不开，因此拉姆齐数极难精确计算，只能不断逼近。而在埃尔德什最初关注的对角情形，八十年努力仅把下界从二的五百次方推到二的五百零一次方。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"随后是突破线索。沈维杰把节点随机撒在高维球面上，再按距离远近给边染色，使需要彼此远离的红色团难以形成；代价是蓝色团增多，但权衡之后在近对角情形仍有收益。这种几何化的相关性舍弃了各边独立同分布的假设。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"概率方法\"}],\"：用随机取样命中目标的概率大于零，来证明对象存在，绕开显式构造。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"拉姆齐数\"}],\"：图大到一定程度必然出现单色团的最小规模，衡量无序中的必然结构。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"单色团\"}],\"：由同色边两两相连的节点集合，是染色图中被禁止出现的模式。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"高维球面几何\"}],\"：高维球面体积小、表面积大、点集中于赤道，违背低维直觉，被用作染色模型。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"相关性染色\"}],\"：按节点间距离决定边的颜色，使红蓝两类坏结构的概率不再对称。\"]}],\"\\n\",[\"$\",\"hr\",null,{}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-t
