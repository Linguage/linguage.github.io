ref\":\"/whatsup/tldr/hn-2026-p9/ai-slop-writing-social-media-study\",\"category\":\"tldr\",\"title\":\"四分之一长文由AI代笔：社交平台内容失守\",\"date\":\"2026-07-10\",\"excerpt\":\"Pangram 分析超百万条帖文发现，四分之一的长文社交媒体内容完全由 AI 生成，LinkedIn 与 X 最为严重，人类原创内容正在被大量稀释。\",\"coverImage\":\"$undefined\",\"author\":\"Brandon Vigliarolo\",\"section\":\"whatsup\"},\"neighbors\":{\"previous\":{\"slug\":\"teleoperated-humanoid-robot-surgery-on-live-pigs\",\"href\":\"/whatsup/tldr/hn-2026-p9/teleoperated-humanoid-robot-surgery-on-live-pigs\",\"category\":\"tldr\",\"title\":\"人形机器人遥操作完成活体猪手术世界首例\",\"date\":\"2026-07-10\",\"excerpt\":\"加州大学圣迭戈分校团队用外科医生遥操作的人形机器人完成活体猪胆囊切除，属世界首例临床前试验，成本远低于传统专用手术机器人，但延迟与频繁校准仍限制临床可用性。\",\"coverImage\":\"$undefined\",\"author\":\"Jeremy Hsu\",\"section\":\"whatsup\"},\"next\":{\"slug\":\"google-search-record-world-cup\",\"href\":\"/whatsup/tldr/hn-2026-p9/google-search-record-world-cup\",\"category\":\"tldr\",\"title\":\"世界杯赛事夜谷歌搜索量创历史峰值\",\"date\":\"2026-07-09\",\"excerpt\":\"世界杯阿根廷绝杀埃及后，谷歌搜索每秒查询量创历史新高，官方未公布具体数字，此举被视为传统搜索在AI聊天机器人冲击下仍具活力的证明。\",\"coverImage\":\"$undefined\",\"author\":\"Jennifer Elias\",\"section\":\"whatsup\"}},\"headings\":[{\"depth\":2,\"text\":\"摘要\",\"id\":\"摘要\"},{\"depth\":2,\"text\":\"内容框架与概述\",\"id\":\"内容框架与概述\"},{\"depth\":2,\"text\":\"核心概念及解读\",\"id\":\"核心概念及解读\"},{\"depth\":2,\"text\":\"原文信息\",\"id\":\"原文信息\"}],\"sidebar\":null,\"directoryHref\":\"/whatsup?tab=tldr\",\"isLongArticle\":false,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L18\"}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"摘要\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#摘要\",\"children\":\"摘要\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"AI 检测平台 Pangram 通过浏览器扩展分析逾百万条帖文，发现超过 250 字的长文中 25% 完全由 AI 生成，LinkedIn 高达 41%，X 为 25% 且另有 23% 属人机合写。短视频之外，Medium 约三分之一涉 AI，Substack 最低但也有 21.9%，Reddit 因评论量大反而最干净。文章认为 AI 内容正淹没互联网，付费检测工具是权宜之计，最终或许只能选择离开这些信息流。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章以一项基于浏览器扩展的数据研究为轴心，先给出总体结论：长文社交媒体中四分之一完全由 AI 撰写，随后按平台逐一拆解，形成从普遍现象到个别差异的递进结构，最后落到对互联网内容生态的悲观判断与应对建议。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"平台对比是全文主干。LinkedIn 在完全由 AI 生成的长文比例上居首，达 41%，短内容也有 30% 为纯 AI 产物，且平台呈现全有或全无的极端分布；X 的纯 AI 比例稍低，但计入 AI 辅助后人机合计接近一半，与 LinkedIn 大致持平。Medium 约三分之一涉 AI，Substack 最低，Reddit 则因评论区几乎全为人类撰写而成为罕见的净土。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章随后引入 Pangram 首席执行官的表态，承认内容全面 AI 化的前景黯淡但并非必然，主张以标注和检测让用户自行规避。然而这一方案绑定了每月二十美元的订阅门槛，免费额度极为有限。作者由此收束全篇：若不愿付费辨别真伪，就只能默认人人都在糊弄，离开信息流反而是最直接的选择。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"AI 内容泛滥\"}],\"：指未披露的机器生成文本大规模占据社交平台，稀释真实人类表达的现象。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"长文阈值\"}],\"：研究以 250 字以上界定长文，这一划分直接影响各平台 AI 占比的统计结果。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"AI 辅助写作\"}],\"：与人机合写相对，指用户借大模型润色或补全内容，统计中通常单列。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"检测订阅制\"}],\"：把识别 AI 内容的能力商品化，以月度付费换取自动扫描信息流的服务。\"]}],\"\\n\
