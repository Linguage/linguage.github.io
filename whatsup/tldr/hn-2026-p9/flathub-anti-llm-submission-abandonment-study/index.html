e:[\"$\",\"$L17\",null,{\"post\":{\"slug\":\"flathub-anti-llm-submission-abandonment-study\",\"href\":\"/whatsup/tldr/hn-2026-p9/flathub-anti-llm-submission-abandonment-study\",\"category\":\"tldr\",\"title\":\"反人工智能提交政策下的开源维护困境\",\"date\":\"2026-07-05\",\"excerpt\":\"作者借Flathub禁止大模型生成提交的政策，手动统计被标注为AI Slop的120个仓库，发现其中88个已停止维护，并借此讨论志愿评审负担、提交者学习缺失与开源可持续性问题。\",\"coverImage\":\"$undefined\",\"author\":\"$undefined\",\"section\":\"whatsup\"},\"neighbors\":{\"previous\":{\"slug\":\"quantum-proofs-power-classical-limit\",\"href\":\"/whatsup/tldr/hn-2026-p9/quantum-proofs-power-classical-limit\",\"category\":\"tldr\",\"title\":\"量子证明为何强于经典证明\",\"date\":\"2026-07-06\",\"excerpt\":\"四名研究者以谱forrelation问题给出QMA与QCMA的预言机分离，为量子证明强于经典证明提供了重要证据；论文获2026年STOC最佳论文奖。\",\"coverImage\":\"$undefined\",\"author\":\"Ben Brubaker\",\"section\":\"whatsup\"},\"next\":{\"slug\":\"mars-perseverance-macromolecular-carbon-bright-angel\",\"href\":\"/whatsup/tldr/hn-2026-p9/mars-perseverance-macromolecular-carbon-bright-angel\",\"category\":\"tldr\",\"title\":\"火星岩石表面的神秘大分子碳\",\"date\":\"2026-07-04\",\"excerpt\":\"毅力号在火星耶泽罗陨石坑外的亮天天使露头，首次在岩石表面直接探测到复杂大分子碳，光谱特征近似地球干酪根，但生物或非生物成因仍无法判定，需样本返回地球才能解答。\",\"coverImage\":\"$undefined\",\"author\":\"Jacek Krywko\",\"section\":\"whatsup\"}},\"headings\":[{\"depth\":2,\"text\":\"摘要\",\"id\":\"摘要\"},{\"depth\":2,\"text\":\"内容框架与概述\",\"id\":\"内容框架与概述\"},{\"depth\":2,\"text\":\"核心概念及解读\",\"id\":\"核心概念及解读\"},{\"depth\":2,\"text\":\"原文信息\",\"id\":\"原文信息\"}],\"sidebar\":null,\"directoryHref\":\"/whatsup?tab=tldr\",\"isLongArticle\":false,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L18\"}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"摘要\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#摘要\",\"children\":\"摘要\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"作者以Flathub在2026年5月拒绝大模型生成提交的决定为切入点，指出真正问题并非意识形态，而是仅数名志愿评审者无力承受由智能体批量制造的低质量提交。他手动核查被标记为AI Slop的120个仓库，发现88个已被放弃，仅32个仍在维护。结论并非断言生成式项目必然死亡，而是提醒这类提交正在消耗不可再生的志愿劳动，同时剥夺提交者理解规则与成长为评审者的机会。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章先还原背景：Flathub的提交流程多年来不断收紧，要求最小权限、源码构建、多架构支持、元数据校验与沙箱例外申请，这些标准的维护者是数量极少的无偿志愿者。当自动化提交工具兴起，评审者面对的是套用模板失败、以长篇套话回应技术意见、并强制推送而无视评论的拉取请求，于是AI Slop标签被创造出来，用于提示同伴不必在此类提交上耗费解释成本。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"作者随后辨析问题的性质。他认为争议并非关于模型生成代码质量的意识形态分歧，而是社区维护型评审基础设施的吞吐量已被垃圾提交击穿；更深的损失在于提交者本人不再经历学习过程，既不了解门户机制，也无法被培养成未来的评审者。他也坦承对该禁令持保留态度，因为它只惩罚公开生成代码的开源者，却放过闭源软件，并预测该决定最终可能被撤销。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"最后一部分是实证尝试。作者用脚本抓取标注AI Slop且创建于四月前的拉取请求，解析其源仓库并人工逐条判定活跃状态，在去重后的120个仓库中得出32个仍在维护、88个被放弃的分布。他明确承认方法与样本的局限，也承认这项统计的动机包含自我校准，但认为约四分之一留存率不足以支撑志愿者继续与自动代理周旋。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"AI Slop标签\"}],\"：由评审者使用的提示标记，用于告知同伴该提交疑似由聊天机器人沟通或完全凭感觉生成，不作为合并的硬性门槛。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"志愿评审基础设施\"}],\"：由少量无偿维护者支撑的审核体系，其审查成本远高于自动化提交的边际成本，因而极易被垃圾流量压垮。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"放弃软件与可持续性\"}],\"：以提交后数月内的提交活动判断项目存续，本研究中约七成仓库在此窗口内停止更新或被删除。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"学习型评审流程\"}],\"：评审不仅是清单核对，更是让提交者理解设计规范与安全边界的训练机制，绕过它等于切断社区再生产的通道。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"自我披露标签\"}],\"：作者主张的替代方案，要求提交方主动声明使用生成工具，而非由平台一刀切地禁止。\"]}],\"\\n\",[\"$\",\"hr\",null,{}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"原文信息\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#原文信息\",\"children\":\"原文信息\"}]}],\"\\n\",[\"$\",\"div\",null,{\"className\":\"my-8 overflow-x-auto border border-border shadow-sm\",\"children\":[\"$\",\"table\",null,{\"className\":\"w-full text-left border-collapse text-[14px] font-sans\",\"children\":[[\"$\",\"thead\",null,{\"className\":\"bg-placeholder/40 border-b border-accent/20\",\"children\":[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"字段\"}],[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"内容\"}]]}]}],[\"$\",\"tbody\",null,{\"className\":\"divide-y divide-border/50\",\"children\":[[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"原文\"}],[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":[\"$\",\"a\",null,{\"href\":\"https://geopjr.dev/blog/democratizing-abandonware\",\"children\":\"Democratizing Abandonware - Evangelos GeopJr Paterakis\"}]}]]}],[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"作者\"}],[\"$\",
