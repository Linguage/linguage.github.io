\"数学家仍未找到最快的乘法算法\",\"date\":\"2026-07-13\",\"excerpt\":\"从小学竖式乘法到1960年23岁学生的惊人突破，讲述乘法算法复杂度这一关乎加密与人工智能的核心谜题为何至今未解\",\"coverImage\":\"$undefined\",\"author\":\"Jack Murtagh\",\"section\":\"whatsup\"},\"neighbors\":{\"previous\":{\"slug\":\"musk-grok-build-repo-upload-privacy\",\"href\":\"/whatsup/tldr/hn-2026-p9/musk-grok-build-repo-upload-privacy\",\"category\":\"tldr\",\"title\":\"马斯克承诺删库 应对Grok Build整仓上传风波\",\"date\":\"2026-07-14\",\"excerpt\":\"AI安全研究者发现Grok Build会把用户整个代码仓库连同Git历史上传云端，事件曝光后官方仅靠服务端开关止损，马斯克承诺彻底删除已上传数据。\",\"coverImage\":\"$undefined\",\"author\":\"Connor Jones\",\"section\":\"whatsup\"},\"next\":{\"slug\":\"social-media-fatigue-why-americans-stopped-posting\",\"href\":\"/whatsup/tldr/hn-2026-p9/social-media-fatigue-why-americans-stopped-posting\",\"category\":\"tldr\",\"title\":\"社交媒体倦怠：过半美国人不再发帖\",\"date\":\"2026-07-12\",\"excerpt\":\"Incogni 调查1000名美国人发现，社交媒体正从放松消遣变成心理负担，过半受访者发帖减少、对受众更挑剔，逾半数认为维持线上形象像在做工作，安全顾虑与政治内容成为退出的主要推力。\",\"coverImage\":\"$undefined\",\"author\":\"Neil J. Rubenking\",\"section\":\"whatsup\"}},\"headings\":[{\"depth\":2,\"text\":\"摘要\",\"id\":\"摘要\"},{\"depth\":2,\"text\":\"内容框架与概述\",\"id\":\"内容框架与概述\"},{\"depth\":2,\"text\":\"核心概念及解读\",\"id\":\"核心概念及解读\"},{\"depth\":2,\"text\":\"原文信息\",\"id\":\"原文信息\"}],\"sidebar\":null,\"directoryHref\":\"/whatsup?tab=tldr\",\"isLongArticle\":false,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L18\"}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"摘要\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#摘要\",\"children\":\"摘要\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章从小学竖式乘法讲起，说明其计算量随位数平方增长，即 O(n²)。1960年一位23岁学生的发现推翻了这一沿袭千年的认知，开创了更快的乘法算法研究。作者进而解释计算机科学家为何用计算步骤而非秒数衡量算法，并指出乘法的极致效率直接关系到加密、人工智能与芯片产业的全局成本，而这一速度上限至今仍是未解之谜。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章以课堂场景切入，指出三位数以上的乘法无法依赖背诵，必须依靠算法。人们世代沿用的竖式乘法被默认是最快方法，这一信念直到1960年才被一位23岁的年轻人动摇，并留下一个悬而未决的问题。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"随后作者解释这一问题的现实分量。乘法是数字世界的底层运算，加密、机器人、人工智能、音频处理乃至各类芯片任务都建立在它之上，且往往涉及超大数的高频相乘。在此规模下，哪怕微小的效率差异也会放大为可观的经济后果。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"接着文章引入衡量算法效率的方法论：不以求秒计，而是统计计算步骤，并忽略进位等次要开销，因为大数情况下这些细节会被主运算彻底淹没。由此引出大O记号，竖式乘法被记为 O(n²)，位数翻倍则工作量变为四倍，位数增千倍则工作量增至百万倍。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"揭示的深层命题是：是否存在比 n 平方更快的乘法，其理论下界究竟在哪里。这一问题自上世纪中叶提出后长期吸引数学界，却至今没有最终答案。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"大O记号\"}],\"：描述算法步骤随输入规模增长的量级，忽略常数与低阶项，用于跨硬件比较算法效率。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"竖式乘法算法\"}],\"：逐位相乘再累加的传统方法，需约 n 平方次单位乘法，被视为效率基准线。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"计算步骤计数\"}],\"：用操作次数而非时间来衡量算法，使结论不依赖具体机器性能。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"乘法下界之谜\"}],\"：比 n 平方更快的方法已被发现，但最快的极限速度至今无人证明。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"数字世界的乘法瓶颈\"}],\"：加密与人工智能等场景中乘法被反复调用，其效率具有全局经济意义。\"]}],\"\\n\",[\"$\",\"hr\",null,{}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"原文信息\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#原文信息\",\"children\":\"原文信息\"}]}],\"\\n\",[\"$\",\"div\",null,{\"className\":\"my-8 overflow-x-auto border border-border shadow-sm\",\"children\":[\"$\",\"table\",null,{\"className\":\"w-full text-left border-collapse text-[14px] font-sans\",\"children\":[[\"$\",\"thead\",null,{\"className\":\"bg-placeholder/40 border-b border-accent/20\",\"children\":[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"字段\"}],[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"内容\"}]]}]}],[\"$\",\"tbody\",null,{\"className\":\"divide-y divide-border/50\",\"children\":[[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"原文\"}],[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":[\"$\",\"a\",null,{\"href\":\"https://www.scientificamerican.com/article/mathematicians-still-dont-know-the-fastest-way-to-multiply-numbers/\",\"children\":\"Mathematicians still dont know the fastest way to multiply numbers\"}]}]]}],[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"作者\"}],[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"Jack Murtagh\"}]]}],[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"发表日
