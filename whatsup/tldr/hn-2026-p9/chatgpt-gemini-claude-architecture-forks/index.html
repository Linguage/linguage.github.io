st\":{\"slug\":\"chatgpt-gemini-claude-architecture-forks\",\"href\":\"/whatsup/tldr/hn-2026-p9/chatgpt-gemini-claude-architecture-forks\",\"category\":\"tldr\",\"title\":\"架构分叉如何塑造三大模型的行为差异\",\"date\":\"2026-07-07\",\"excerpt\":\"从密度、多模态、上下文窗口与推理路由四个架构分叉点切入，解释ChatGPT、Gemini与Claude在相同提示下表现差异的根源，说明设计选择如何直接塑造用户可见的能力边界。\",\"coverImage\":\"$undefined\",\"author\":\"ByteByteGo\",\"section\":\"whatsup\"},\"neighbors\":{\"previous\":{\"slug\":\"is-life-just-different-biological-agency\",\"href\":\"/whatsup/tldr/hn-2026-p9/is-life-just-different-biological-agency\",\"category\":\"tldr\",\"title\":\"生命只是与众不同吗：生物能动性之争\",\"date\":\"2026-07-08\",\"excerpt\":\"文章从伽利略号在太空探测到地球生命谈起，探讨生物能动性概念之争，追问生命是否因有目标与理由而区别于无机物，以及该概念能否成为有产出的科学议题。\",\"coverImage\":\"$undefined\",\"author\":\"Philip Ball\",\"section\":\"whatsup\"},\"next\":{\"slug\":\"learning-language-slows-brain-ageing\",\"href\":\"/whatsup/tldr/hn-2026-p9/learning-language-slows-brain-ageing\",\"category\":\"tldr\",\"title\":\"学习外语或可延缓大脑衰老\",\"date\":\"2026-07-06\",\"excerpt\":\"研究显示多语者的脑连通性更显年轻，双语约年轻六岁，四语约十三岁，且语言水平越高、第二语言习得越早，延缓脑衰老的效应越强。\",\"coverImage\":\"$undefined\",\"author\":\"Anna Bawden\",\"section\":\"whatsup\"}},\"headings\":[{\"depth\":2,\"text\":\"摘要\",\"id\":\"摘要\"},{\"depth\":2,\"text\":\"内容框架与概述\",\"id\":\"内容框架与概述\"},{\"depth\":2,\"text\":\"核心概念及解读\",\"id\":\"核心概念及解读\"},{\"depth\":2,\"text\":\"原文信息\",\"id\":\"原文信息\"}],\"sidebar\":null,\"directoryHref\":\"/whatsup?tab=tldr\",\"isLongArticle\":false,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L18\"}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"摘要\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#摘要\",\"children\":\"摘要\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"三家前沿模型的差异并非随机，而是源于相同的架构分叉处做出的不同设计选择。文章以Transformer基础为起点，依次剖析密度（MoE与稠密网络）、多模态（原生与拼接）、上下文窗口以及推理路由四条技术路线，指出Google、OpenAI与Anthropic各自取舍如何直接转化为用户可感知的行为特征，如Gemini擅长大视频与超长上下文、ChatGPT侧重运行时路由效率、Claude坚持文本优先与高分辨率图像。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章先确立共同基础：三者都建立在Transformer与自注意力机制之上，都经历预训练与后训练两阶段，差异来自围绕核心组件做出的架构决策。随后提出一个贯穿全文的分析框架，即同一设计问题在不同公司得到不同答案，而答案决定可观察的行为。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"接着依次展开三个分叉。密度问题上，Google采用稀疏混合专家以更低算力换取更大容量，代价是输出方差上升；多模态问题上，Gemini从诞生即为原生多模态，OpenAI从分离管线转向统一架构，Anthropic则坚持文本与视觉优先。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"最后讨论上下文窗口，说明注意力随长度近似二次增长以及长上下文中早期信息失效的质量衰减，并对比Gemini的百万级窗口、Anthropic的压缩机制与OpenAI的保守策略与路由思路，落点在用户实际体验差异。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"混合专家MoE\"}],\"：用多个小专家加路由器替代单个巨型计算块，每token仅激活少数专家，以更低算力换取更大总容量。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"原生多模态\"}],\"：从训练之初就让文本、图像、音频共存于同一序列，由同一套Transformer层处理，而非事后拼接编码器。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"上下文窗口\"}],\"：单次可关注的输入长度，受注意力二次成本与长程信息衰减双重制约，是能力与成本的核心权衡。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"上下文腐化\"}],\"：长时间会话中早期内容相关性逐渐下降的现象，Anthropic以自动压缩摘要加以缓解。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"运行时路由\"}],\"：在推理阶段由路由器选择不同子模型处理不同提示，以效率换取单一超大模型的统一性。\"]}],\"\\n\",[\"$\",\"hr\",null,{}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"原文信息\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#原文信息\",\"children\":\"原文信息\"}]}],\"\\n\",[\"$\",\"div\",null,{\"className\":\"my-8 overflow-x-auto border border-border shadow-sm\",\"children\":[\"$\",\"table\",null,{\"className\":\"w-full text-left border-collapse text-[14px] font-sans\",\"children\":[[\"$\",\"thead\",null,{\"className\":\"bg-placeholder/40 border-b border-accent/20\",\"children\":[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"字段\"}],[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"内容\"}]]}]}],[\"$\",\"tbody\",null,{\"className\":\"divide-y divide-border/50\",\"children\":[[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"原文\"}],[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":[\"$\",\"a\",null,{\"href\":\"https://blog.bytebytego.com/p/chatgpt-vs-gemini-vs-claude-how-they\",\"children\":\"ChatGPT vs Gemini vs Claude: How They Differ\"}]}]]}],[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"作者\"}],[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"ByteByteGo\"}]]}],[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"classN
