children-using-ai-homework-and-life-advice\",\"href\":\"/whatsup/tldr/hn-2026-p9/children-using-ai-homework-and-life-advice\",\"category\":\"tldr\",\"title\":\"儿童用AI写作业并向其寻求生活建议\",\"date\":\"2026-07-01\",\"excerpt\":\"联合国儿童基金会依据十国数据估算，至少2000万儿童已使用人工智能，其中约200万人向AI倾诉个人烦恼，1300万人用于完成作业，而安全保障与监管明显滞后。\",\"coverImage\":\"$undefined\",\"author\":\"© 联合国儿童基金会/普里扬卡·帕拉沙尔\",\"section\":\"whatsup\"},\"neighbors\":{\"previous\":{\"slug\":\"cloudflare-ai-traffic-control-options\",\"href\":\"/whatsup/tldr/hn-2026-p9/cloudflare-ai-traffic-control-options\",\"category\":\"tldr\",\"title\":\"Cloudflare 细分 AI 爬虫流量管控\",\"date\":\"2026-07-01\",\"excerpt\":\"Cloudflare 推出按搜索、代理、训练三类用途管理 AI 爬虫的新选项，将于 2026 年 9 月 15 日对新域名设置默认规则，并发布 BotBase 机器人可见性数据库。\",\"coverImage\":\"$undefined\",\"author\":\"$undefined\",\"section\":\"whatsup\"},\"next\":{\"slug\":\"arxiv-spin-out-from-cornell\",\"href\":\"/whatsup/tldr/hn-2026-p9/arxiv-spin-out-from-cornell\",\"category\":\"tldr\",\"title\":\"康奈尔剥离后 arXiv 迈向独立非营利新阶段\",\"date\":\"2026-07-01\",\"excerpt\":\"arXiv 于 2026 年 7 月 1 日脱离康奈尔大学成为独立非营利机构，文章重申使命与开放获取不变，并说明通过 FAQ 与系列博客保持透明沟通、确保服务不中断。\",\"coverImage\":\"$undefined\",\"author\":\"Kat Boboris\",\"section\":\"whatsup\"}},\"headings\":[{\"depth\":2,\"text\":\"摘要\",\"id\":\"摘要\"},{\"depth\":2,\"text\":\"内容框架与概述\",\"id\":\"内容框架与概述\"},{\"depth\":2,\"text\":\"核心概念及解读\",\"id\":\"核心概念及解读\"},{\"depth\":2,\"text\":\"原文信息\",\"id\":\"原文信息\"}],\"sidebar\":null,\"directoryHref\":\"/whatsup?tab=tldr\",\"isLongArticle\":false,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L18\"}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"摘要\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#摘要\",\"children\":\"摘要\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"儿基会基于十国新数据估算，至少2000万儿童已在使用人工智能，青少年采用速度是成年人三倍以上。约200万儿童向AI倾诉个人烦恼，1300万儿童用它完成作业。儿基会警告这一代人正身处一场全球性实验，儿童对技术设计与数据使用几乎无从掌控，却最先承受监管缺位的后果，因此呼吁各国政府与科技公司把儿童权利置于人工智能治理核心。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章先以量化数据勾勒现状。儿基会依据来自十个国家的调查推断，全球至少2000万儿童接触并使用过人工智能，青少年采用该技术的增速超过成年人的三倍，使用场景已从学习延伸到情感与生活层面。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"随后文章揭示使用结构的两个突出侧面：约200万儿童会就自身担忧向人工智能寻求建议，另有1300万儿童借助它完成学校作业与家庭作业。人工智能由此不再只是工具，而开始介入儿童的心理支持与日常决策。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"接着文章转向风险与证据缺口。儿基会指出，人工智能对儿童发展、情绪健康及潜在伤害的影响，相关研究才刚刚起步，这一代人实际上是在一场全球性实验中成长。儿童自身亦有警觉，三分之一担心诈骗与虚假信息，四分之一担心自己的图像被篡改为露骨内容。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"最后是治理主张。值首届人工智能治理全球对话召开之际，儿基会敦促各国政府与科技公司将儿童权利置于监管核心，具体包括防范AI助长性剥削、加大影响研究投入、构建更安全透明的系统、提升儿童与家长数字素养，并扩大数字接入以避免鸿沟扩大。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"全球性实验\"}],\"：指儿童在缺乏充分证据与保护的前提下大规模使用人工智能，其长期影响尚不可知。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"人工智能鸿沟\"}],\"：数字接入不均导致的新的机会不平等，可能使部分儿童被排除在技术红利之外。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"深度伪造\"}],\"：利用人工智能篡改图像或视频生成逼真虚假内容，儿童担心自身影像被恶意利用。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"数字素养\"}],\"：儿童与家长理解并安全使用人工智能的能力，被视为监管之外的重要防线。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"儿童权利核心化\"}],\"：主张在人工智能治理与系统设计中，把儿童的安全、隐私与平等机会置于优先位置。\"]}],\"\\n\",[\"$\",\"hr\",null,{}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"原文信息\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#原文信息\",\"children\":\"原文信息\"}]}],\"\\n\",[\"$\",\"div\",null,{\"className\":\"my-8 overflow-x-auto border border-border shadow-sm\",\"children\":[\"$\",\"table\",null,{\"className\":\"w-full text-left border-collapse text-[14px] font-sans\",\"children\":[[\"$\",\"thead\",null,{\"className\":\"bg-placeholder/40 border-b border-accent/20\",\"children\":[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"字段\"}],[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"内容\"}]]}]}],[\"$\",\"tbody\",null,{\"className\":\"divide-y divide-border/50\",\"children\":[[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"原文\"}],[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":[\"$\",\"a\",null,{\"href\":\"https://news.un.org/zh/story/2026/06/1142411\",\"children\":\"儿童开始借助人工智能完成作业——甚至寻求生活建议\"}]}]]}],[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"作者\"}],[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"© 联合国儿童基金会/普里扬卡·帕拉沙尔\"}]]}],[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-c
