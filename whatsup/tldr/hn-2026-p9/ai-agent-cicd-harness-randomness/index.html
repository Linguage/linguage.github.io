arness-randomness\",\"href\":\"/whatsup/tldr/hn-2026-p9/ai-agent-cicd-harness-randomness\",\"category\":\"tldr\",\"title\":\"驯服AI随机性：Agent时代的CI/CD生存体系\",\"date\":\"2026-07-23\",\"excerpt\":\"阿里a1 CLI团队分享如何用分层门禁、AI动态冒烟、CI历史注入与Beta遥测分析构建一套治理框架，把AI的随机性约束在可控范围内，实现每个工作日自动发版。\",\"coverImage\":\"$undefined\",\"author\":\"吕超\",\"section\":\"whatsup\"},\"neighbors\":{\"previous\":{\"slug\":\"yu-deng-fields-medal-2026-random-data-problem\",\"href\":\"/whatsup/tldr/hn-2026-p9/yu-deng-fields-medal-2026-random-data-problem\",\"category\":\"tldr\",\"title\":\"邓煜获2026菲尔兹奖：随机数据问题的突破\",\"date\":\"2026-07-23\",\"excerpt\":\"华裔数学家邓煜因在随机数据问题上的突破性工作获得2026年菲尔兹奖，文章讲述他以概率工具研究偏微分方程，并回溯其从深圳少年到围棋冲段失败、再到奥赛夺金的成长轨迹。\",\"coverImage\":\"$undefined\",\"author\":\"Jordana Cepelewicz\",\"section\":\"whatsup\"},\"next\":{\"slug\":\"jacobian-conjecture-for-baby\",\"href\":\"/whatsup/tldr/hn-2026-p9/jacobian-conjecture-for-baby\",\"category\":\"tldr\",\"title\":\"从零讲透雅可比猜想与它的八十七年\",\"date\":\"2026-07-22\",\"excerpt\":\"一篇面向零基础读者的科普长文，用图像与算术逐步讲清函数、逆映射、多项式与平面映射，引出悬置八十七年的雅可比猜想，并介绍2026年惊现的部分突破。\",\"coverImage\":\"$undefined\",\"author\":\"$undefined\",\"section\":\"whatsup\"}},\"headings\":[{\"depth\":2,\"text\":\"摘要\",\"id\":\"摘要\"},{\"depth\":2,\"text\":\"内容框架与概述\",\"id\":\"内容框架与概述\"},{\"depth\":2,\"text\":\"核心概念及解读\",\"id\":\"核心概念及解读\"},{\"depth\":2,\"text\":\"原文信息\",\"id\":\"原文信息\"}],\"sidebar\":null,\"directoryHref\":\"/whatsup?tab=tldr\",\"isLongArticle\":false,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L18\"}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"摘要\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#摘要\",\"children\":\"摘要\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章以阿里a1 CLI为案例，讲述一条日活数万的生产级工具链如何从不敢发版走到每个工作日自动发版。核心命题是把AI的随机性当作工程问题而非道德问题来处理：用分层门禁守准入，用AI生成动态冒烟测试补盲区，用CI历史注入给无状态模型造短期记忆，用真实用户遥测数据为发布背书。主张不让AI追求百分之百正确，而是构建一套即使AI犯错也不会酿成灾难的系统。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章先提出问题的转向。传统CI/CD解决的是人写代码如何安全发布，AI Agent时代则变成如何让一个本质随机的系统产出可预测、可信赖的变更。作者用自动驾驶L1到L5的分级作类比，指出AI研发正在经历同一种信任建立过程，并把敢不敢发概括为团队的新焦虑。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"随后进入具体机制。代码合入前铺设四层门禁，从单测覆盖率、真实API全量冒烟，到文档同步与命令下线规范检查，每一层都配逃生舱，机器守规矩而人保留最终决策权。针对AI改动落在已有用例盲区的问题，团队让AI为AI的代码生成动态冒烟测试，用JSON schema约束输出结构，用deny-list剔除不可测命令，并对deny-list的改动设两段式人工卡点。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"第三层是反馈与发布。流水线通过CLI查询自己的CI历史，把上次失败日志注入prompt，人为赋予无状态模型短期记忆，形成狗粮闭环；同时用soft-skip保证学习环节永不阻塞发布。发布侧则用Beta灰度加遥测分析取代消极等待，以失败率、Top失败命令、CI与非CI对比、错误类型四维数据说话，异常才唤起人工审核。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"最后是方法论收束与展望。七个策略按作用阶段分层，约束、缩小、反馈作用于生成，隔离、数据验证、分层验证、逃生舱作用于执行与发布，核心是建立容错系统而非完美AI。未来方向是从人工审核走向AI自主决策，从短期记忆走向长期记忆，从测试驱动走向数据反哺。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"逃生舱机制\"}],\"：每个门禁都留跳过标记，机器负责守规矩，人保留最终决策权，避免严格流程把人锁死。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"AI自检闭环\"}],\"：让大模型为AI提交的代码变更生成冒烟测试，再用格式校验与重试上限约束随机性。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"Deny-list两段式卡点\"}],\"：往不可测命令列表加一行就能静默跳过一批验证，故设diff检测加人工审核双重防护。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"CI历史注入\"}],\"：用CLI查询自身的CI记录并把失败日志喂给模型，为无状态Agent人为赋予短期记忆。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"Fail-safe默认求证伪\"}],\"：遥测查询失败即判定异常，产物缺失即让流水线变红，宁可多惊动人也不放过脏数据。\"]}],\"\\n\",[\"$\",\"hr\",null,{}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"原文信息\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#原文信息\",\"children\":\"原文信息\"}]}],\"\\n\",[\"$\",\"div\",null,{\"className\":\"my-8 overflow-x-auto border border-border shadow-sm\",\"children\":[\"$\",\"table\",null,{\"className\":\"w-full text-left border-collapse text-[14px] font-sans\",\"children\":[[\"$\",\"thead\",null,{\"className\":\"bg-placeholder/40 border-b border-accent/20\",\"children\":[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"字段\"}],[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"内容\"}]]}]}],[\"$\",\"tbody\",null,{\"className\":\"divide-y divide-border/50\",\"children\":[[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"原文\"}],[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":[\"$\",\"a\",null,{\"href\":\"https://mp.weixin.qq.com/s?__biz=Mzg4NTczNzg2OA==\u0026mid=2247509947\u0026idx=1\u0026sn=7d2cc8a374fb1454aeab9ca90ef28f5d\u0026poc_token=HPPOYWqjL1laeVRRRuB8XcATpIGJ4ELmmzW5gkd7\",\"children\":\"从不敢发到天天发：AI Agent 时代的 CI/CD 生存指南\"}]}]]}],[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5
