e\":\"2026-07-21\",\"excerpt\":\"借王虹与邓煜获2026年菲尔兹奖之机，对比两人迥异的成长路径，反思数学人才选拔制度的偏差与培养环境的重要性。\",\"coverImage\":\"$undefined\",\"author\":\"倪忆\",\"section\":\"whatsup\"},\"neighbors\":{\"previous\":{\"slug\":\"agi-hype-reflection-and-strategic-sovereignty\",\"href\":\"/whatsup/tldr/hn-2026-p9/agi-hype-reflection-and-strategic-sovereignty\",\"category\":\"tldr\",\"title\":\"朱松纯谈AI热潮反思与思想自主\",\"date\":\"2026-07-21\",\"excerpt\":\"朱松纯在2026世界人工智能大会思想者论坛的演讲整理，解构AI热潮背后的国际叙事、硅谷华尔街华盛顿三重奏与产业泡沫，主张回到智能的第一性原理，构建AGI的战略主动与中国叙事。\",\"coverImage\":\"$undefined\",\"author\":\"知识分子​\",\"section\":\"whatsup\"},\"next\":{\"slug\":\"jacobian-conjecture-claude-fable-disproof\",\"href\":\"/whatsup/tldr/hn-2026-p9/jacobian-conjecture-claude-fable-disproof\",\"category\":\"tldr\",\"title\":\"数学家借AI模型给出雅可比猜想反例\",\"date\":\"2026-07-20\",\"excerpt\":\"数学家Levent Alpöge借助Anthropic的Fable 5模型，在世界杯决赛当晚给出三维多项式映射反例，宣称推翻悬置87年的雅可比猜想，结论仍待同行评审。\",\"coverImage\":\"$undefined\",\"author\":\"AI Desk\",\"section\":\"whatsup\"}},\"headings\":[{\"depth\":2,\"text\":\"摘要\",\"id\":\"摘要\"},{\"depth\":2,\"text\":\"内容框架与概述\",\"id\":\"内容框架与概述\"},{\"depth\":2,\"text\":\"核心概念及解读\",\"id\":\"核心概念及解读\"},{\"depth\":2,\"text\":\"原文信息\",\"id\":\"原文信息\"}],\"sidebar\":null,\"directoryHref\":\"/whatsup?tab=tldr\",\"isLongArticle\":false,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L18\"}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"摘要\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#摘要\",\"children\":\"摘要\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章以王虹、邓煜获2026年菲尔兹奖为引，对比二人迥异的成长路径，讨论数学人才如何选拔与培养。作者认为竞赛与高考能完成选拔，却难以考察科研所需素质，会遗漏大量非典型天才；而北大式的宽松环境、转系便利与专注教学的好老师，才是顶尖人才成长的关键土壤。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-
