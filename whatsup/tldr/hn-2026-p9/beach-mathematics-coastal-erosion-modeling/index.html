-mathematics-coastal-erosion-modeling\",\"category\":\"tldr\",\"title\":\"海滩上的数学：模拟海浪侵蚀与咸潮入侵\",\"date\":\"2026-07-24\",\"excerpt\":\"法国国家科研中心介绍三个数学研究项目，用方程模拟海浪、沙粒与海水入渗，以应对海岸侵蚀与极端气候。\",\"coverImage\":\"$undefined\",\"author\":\"$undefined\",\"section\":\"whatsup\"},\"neighbors\":{\"previous\":{\"slug\":\"grothendieck-a-committed-genius-legacy\",\"href\":\"/whatsup/tldr/hn-2026-p9/grothendieck-a-committed-genius-legacy\",\"category\":\"tldr\",\"title\":\"格罗滕迪克逝世十周年：天才的数学遗产与反思\",\"date\":\"2026-07-24\",\"excerpt\":\"菲尔兹奖得主格罗滕迪克逝世十周年之际，数学家 Leila Schneps 回顾他横跨函数分析与代数几何的三段学术生涯、七万页手稿的整理，以及他将数学视为沟通语言的独特视野。\",\"coverImage\":\"$undefined\",\"author\":\"$undefined\",\"section\":\"whatsup\"},\"next\":{\"slug\":\"terence-tao-ai-views-living-summary\",\"href\":\"/whatsup/tldr/hn-2026-p9/terence-tao-ai-views-living-summary\",\"category\":\"tldr\",\"title\":\"陶哲轩论AI的认知边界与实践准则\",\"date\":\"2026-07-24\",\"excerpt\":\"陶哲轩AI观点活文档摘要，梳理其对AI本质、数学应用场景与使用边界的判断，强调概率核与可验证性优势，并用比较优势与可接受错误率两问指导实践。\",\"coverImage\":\"$undefined\",\"author\":\"$undefined\",\"section\":\"whatsup\"}},\"headings\":[{\"depth\":2,\"text\":\"摘要\",\"id\":\"摘要\"},{\"depth\":2,\"text\":\"内容框架与概述\",\"id\":\"内容框架与概述\"},{\"depth\":2,\"text\":\"核心概念及解读\",\"id\":\"核心概念及解读\"},{\"depth\":2,\"text\":\"原文信息\",\"id\":\"原文信息\"}],\"sidebar\":null,\"directoryHref\":\"/whatsup?tab=tldr\",\"isLongArticle\":false,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L18\"}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"摘要\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#摘要\",\"children\":\"摘要\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章介绍法国优先研究与装备计划中的三个数学项目，探讨如何用方程刻画海滩这一复杂环境。研究者借助纳维-斯托克斯方程模拟海浪与海啸，用颗粒力学描述湿润沙土的毛细作用，并研究海水向地下含水层的入渗。目标不是精确预测，而是更好理解海岸动态，为沿海治理与决策提供依据。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章从海滩这一日常场景切入，指出其中蕴含波浪生成、岩石侵蚀、海水下渗等复杂物理过程，并强调在气候变化背景下海岸将面临海平面上升、极端事件频发与侵蚀加速。由此引出三个数学研究项目，将纯数学、地球物理与海洋学结合在一起，服务于未来海岸规划。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"随后文章按空间层次展开。第一部分聚焦水与海浪，回顾纳维-斯托克斯方程两百年的历史，说明研究者如何忽略微观细节、只保留宏观可感知效应，从而为海啸与极端海浪建立可用的预测模型，用于疏散规划与海上能源设施安全。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"第二部分转向沙粒。文章指出水与颗粒的相互作用长期研究不足，而毛细力让湿沙能够彼此黏结，这正是沙堡得以堆起的原因。相关项目试图描述固液两相共存时的行为，以理解岩石侵蚀、海岸线演变与沙滩流失，并提醒沙是一种并不充裕的资源。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"最后一部分揭示海面之下的问题，即海水向地下含水层的入渗。以拉罗谢尔为例，过度抽取淡水会导致咸水上升，使水井失去使用价值。研究意在找到合理的取水节奏，降低含水层盐化的风险。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"纳维-斯托克斯方程\"}],\"：描述流体运动的偏微分方程，用于刻画水与空气在时空中的变化。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"毛细力\"}],\"：湿沙中水将颗粒黏结在一起的力，是沙堡能够成形的物理原因。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"颗粒介质\"}],\"：由大量形状大小各异的沙粒组成的两相体系，其建模难度远高于纯流体。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"咸潮入侵\"}],\"：海水下渗并上移进入地下含水层，导致淡水井盐化而无法饮用。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"海岸侵蚀\"}]
