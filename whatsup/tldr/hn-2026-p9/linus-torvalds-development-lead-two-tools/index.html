ead-two-tools\",\"href\":\"/whatsup/tldr/hn-2026-p9/linus-torvalds-development-lead-two-tools\",\"category\":\"tldr\",\"title\":\"林纳斯自述不再是程序员：只用两个工具\",\"date\":\"2026-07-09\",\"excerpt\":\"林纳斯在开源峰会上谈论Linux稳步演进、AI带来的压力、淘汰过时硬件，以及他自认不再是程序员而是开发主管，日常只用Git和邮件两件工具。\",\"coverImage\":\"$undefined\",\"author\":\"Steven Vaughan-Nichols\",\"section\":\"whatsup\"},\"neighbors\":{\"previous\":{\"slug\":\"alien-civilizations-statistical-search\",\"href\":\"/whatsup/tldr/hn-2026-p9/alien-civilizations-statistical-search\",\"category\":\"tldr\",\"title\":\"我们能否找到外星文明：统计学视角下的探寻\",\"date\":\"2026-07-09\",\"excerpt\":\"哥伦比亚大学天文学家 David Kipping 在播客中讨论如何用统计框架把外星生命这一古老问题转化为可计算的科学问题，并解释生物标志物难以判读的原因以及系外卫星为何可能被长期忽视。\",\"coverImage\":\"$undefined\",\"author\":\"Janna Levin\",\"section\":\"whatsup\"},\"next\":{\"slug\":\"is-life-just-different-biological-agency\",\"href\":\"/whatsup/tldr/hn-2026-p9/is-life-just-different-biological-agency\",\"category\":\"tldr\",\"title\":\"生命只是与众不同吗：生物能动性之争\",\"date\":\"2026-07-08\",\"excerpt\":\"文章从伽利略号在太空探测到地球生命谈起，探讨生物能动性概念之争，追问生命是否因有目标与理由而区别于无机物，以及该概念能否成为有产出的科学议题。\",\"coverImage\":\"$undefined\",\"author\":\"Philip Ball\",\"section\":\"whatsup\"}},\"headings\":[{\"depth\":2,\"text\":\"摘要\",\"id\":\"摘要\"},{\"depth\":2,\"text\":\"内容框架与概述\",\"id\":\"内容框架与概述\"},{\"depth\":2,\"text\":\"核心概念及解读\",\"id\":\"核心概念及解读\"},{\"depth\":2,\"text\":\"原文信息\",\"id\":\"原文信息\"}],\"sidebar\":null,\"directoryHref\":\"/whatsup?tab=tldr\",\"isLongArticle\":false,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L18\"}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"摘要\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#摘要\",\"children\":\"摘要\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"在开源峰会上，林纳斯表示Linux走的是九到十周一次的稳步节奏，刻意避免大张旗鼓的新特性。他认为AI找漏洞给社区带来了压力，并坚持淘汰无人使用的过时硬件与协议。他已自认不再是程序员，而是开发主管，日常只用Git和邮件，写补丁仅为建议。他看好C的验证工具，并警告Rust无法修复逻辑错误。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章以林纳斯与老友对谈形式展开，先谈Linux 7.1的定位。他强调发布只是持续增量的改进，而非轰动性功能，这种模式正被AI不断挖出漏洞的压力所扰动。\\n随后话题转向他的日常工作方式。他描述合并窗口内约两百次合并的节奏，希望维护者不要把非关键修复压到最后提交。他坦言真正让人疲惫的不是技术问题，而是人际与性格问题。\\n接着是身份转变的自述。他几乎不再读代码，只写带有建议性质的小补丁，更关注拉取请求背后的意图和整体图景，愿意在构建中断或冲突时才深入代码。\\n最后是技术与生态判断。他认为自己不是多愁善感的人，主张清理博物馆级硬件和ISDN、ATM等旧标准；同时质疑Rust能包治百病的说法，强调语言无法纠正逻辑错误，而混合代码边界上其保证会失效。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"开发主管\"}],\"：林纳斯的自我定位，几乎不读代码，重心转向理解意图、协调人与推进流程。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"稳步演进模型\"}],\"：自Git诞生后确立的发布哲学，拒绝大特性，追求每九到十周一次的持续增量改进。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"博物馆级硬件\"}],\"：指几乎无人使用、仅存于收藏场景的旧设备与协议，维护成本超过价值后即被移除。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"Rust的保证边界\"}],\"：其内存安全等保证只在纯Rust代码内成立，与C交互处失效，且无法修复逻辑错误。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"自动化验证工具\"}],\"：如补丁校验与邮件检查类工具，被视为比换语言更能提升C代码质量的方向。\"]}],\"\\n\",[\"$\",\"hr\",null,{}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px]
