[15px] leading-[1.28]\",\"id\":\"摘要\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#摘要\",\"children\":\"摘要\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"Anthropic承认数月前在Claude Code中植入隐写代码，通过检测被覆盖的基础URL、系统时区与已知域名列表，识别中国AI实验室、转售商与网关，以打击账户滥用与模型蒸馏。工程师称更强缓解措施已上线，移除PR已合并并将随7月1日版本发布。批评者认为技术目的可以理解，但隐蔽实现方式违背开发者工具应具备的信任与透明。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章先交代事件与时间线：Anthropic工程师在社交平台说明，三月上线的实验意在阻止未授权转售与蒸馏，团队此后已采用更强缓解手段，移除代码的合并请求已通过，将随七月一日的版本发布。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"随后进入技术细节。开发者Thereallo披露，该代码把代理与网关分类信息编码进看似普通英文的句子，用近乎不可见的Unicode标记改写系统提示，并以XOR与base64隐藏域名清单，清单涵盖中国AI实验室、其他AI公司、账户转售商与网关域名。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"争议焦点在于实现方式而非目的。识别竞对或转售商本身可以理解，但隐蔽改写提示与加密域名表引发信任质疑；公司未正面回应是否在服务条款中披露该追踪机制，也未说明所谓更强缓解措施的具体内容。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"最后是更大的背景。二月Anthropic曾宣布反蒸馏投入，包括分类器、行为指纹、情报共享与访问控制；其源码泄露后还暴露出注入假工具数据以污染训练语料的标记，并呼吁业界、云厂商与政府共同应对蒸馏威胁，白宫行政令显示联邦层面已有兴趣。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"提示词隐写\"}],\"：把分类信息伪装成普通英文句子，并用近乎不可见的Unicode标记改写系统提示，使追踪难以被察觉。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"模型蒸馏\"}],\"：通过大量重复查询复制模型能力的行为，被视为需要重点防御
