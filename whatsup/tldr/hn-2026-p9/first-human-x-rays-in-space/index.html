-x-rays-in-space\",\"category\":\"tldr\",\"title\":\"宇航员首次在轨完成人体X光成像\",\"date\":\"2026-07-15\",\"excerpt\":\"全平民太空任务 Fram2 首次在轨拍出可用于诊断的人体X光影像，验证便携X射线设备在微重力下的可行性，为未来月球与火星任务中不依赖地球的自主医疗诊断奠定基础。\",\"coverImage\":\"$undefined\",\"author\":\"Michelle Starr\",\"section\":\"whatsup\"},\"neighbors\":{\"previous\":{\"slug\":\"meta-ai-layoffs-lawsuit\",\"href\":\"/whatsup/tldr/hn-2026-p9/meta-ai-layoffs-lawsuit\",\"category\":\"tldr\",\"title\":\"Meta被诉用AI算法裁员涉嫌歧视\",\"date\":\"2026-07-15\",\"excerpt\":\"Meta遭26名前员工起诉，指控其以Metamate等内部AI系统为员工打分排名并据此裁减8000人，使休受保护病假与残障员工被不成比例选中，涉嫌违反多项反歧视法；Meta否认指控，称裁员决策由人做出。\",\"coverImage\":\"$undefined\",\"author\":\"Jon Brodkin\",\"section\":\"whatsup\"},\"next\":{\"slug\":\"formal-verification-lean-otp-tutorial\",\"href\":\"/whatsup/tldr/hn-2026-p9/formal-verification-lean-otp-tutorial\",\"category\":\"tldr\",\"title\":\"用 Lean 形式化验证一次性密码本入门\",\"date\":\"2026-07-15\",\"excerpt\":\"面向密码学工程师的 Lean 4 形式化验证入门教程第一部分，讲解如何用 Lean 定义比特串与异或，并逐步形式化验证一次性密码本的正确性。\",\"coverImage\":\"$undefined\",\"author\":\"$undefined\",\"section\":\"whatsup\"}},\"headings\":[{\"depth\":2,\"text\":\"摘要\",\"id\":\"摘要\"},{\"depth\":2,\"text\":\"内容框架与概述\",\"id\":\"内容框架与概述\"},{\"depth\":2,\"text\":\"核心概念及解读\",\"id\":\"核心概念及解读\"},{\"depth\":2,\"text\":\"原文信息\",\"id\":\"原文信息\"}],\"sidebar\":null,\"directoryHref\":\"/whatsup?tab=tldr\",\"isLongArticle\":false,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L18\"}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"摘要\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#摘要\",\"children\":\"摘要\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"人类在轨医疗影像长期依赖超声，因X射线需光源、探测器与患者精准对位且保持静止。Fram2全平民轨道任务的乘组用超便携无线X射线发生器，经四小时训练后为自身手掌、前臂、胸腹与骨盆成像，地面放射科医生独立评估确认画质达到诊断标准，标志太空医学从可能走向可行，也为航天器无损检测开辟新用途。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章以时间线展开：超声主导在轨影像四十余年的历史局限，X射线因设备庞大与微重力定位困难而长期缺席；近年X射线设备小型化与电池化，使在轨成像重新成为可行设想，2022年抛物线飞行的短暂微重力实验成为关键铺垫。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"核心事件是SpaceX的Fram2极轨任务。乘组携带超便携无线数字X射线发生器，接受四小时训练，在飞行前后及在轨期间完成对照体模、智能手表与人体多部位成像，地面放射科医生独立判读，确认整体画质达到诊断阈值。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章随后给出结果分层：手部与手臂最易清晰成像，胸腹与骨盆质量略低但仍可用于诊断，最大难点不在成像本身而在患者、探测器与光源的对位与静止。用途亦不限于医疗，智能手表影像暗示其可服务航天器硬件的无损检测。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"结尾转向局限与展望：在轨成像时间有限、未来任务可能缺乏实时远程医疗支持，故研究者提出以人工智能辅助评估图像质量与识别病症；设备返回地球时受损虽仍可用，但面向月球与火星需更坚固、更轻小的系统。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"便携X射线成像\"}],\"：超便携无线数字发生器配合探测器，可在微重力下完成人体诊断级成像。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"微重力成像难题\"}],\"：患者、光源与探测器易漂浮移位，核心策略是以极短曝光时间冻结运动。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"无损检测\"}],\"：利用X射线透视航天器部件与硬件内部隐藏损伤，与医疗诊断共用同一技术。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"超声对照\"}],\"：四十余年来唯一实用在轨影像手段，便携安全但高度依赖操作者训练。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"child
