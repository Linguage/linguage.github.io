/whatsup/tldr/hn-2026-p9/lean-formal-verification-math-ai\",\"category\":\"tldr\",\"title\":\"押上职业生涯：Lean 如何改写数学\",\"date\":\"2026-06-24\",\"excerpt\":\"讲述微软研究院的 Lean 定理证明器如何从无人问津的软件工具，成长为数学家群体与 AI 校验数学证明的核心基础设施，并追问机器核查能否替代人类的数学判断。\",\"coverImage\":\"$undefined\",\"author\":\"Breaking Math\",\"section\":\"whatsup\"},\"neighbors\":{\"previous\":{\"slug\":\"erdos-probabilistic-method-ramsey-upgrade\",\"href\":\"/whatsup/tldr/hn-2026-p9/erdos-probabilistic-method-ramsey-upgrade\",\"category\":\"tldr\",\"title\":\"八十年后数学家为埃尔德什概率方法升级\",\"date\":\"2026-06-26\",\"excerpt\":\"八十年后，数学家借助高维球面几何改造埃尔德什的概率方法，改进了长期停滞的近对角拉姆齐数下界。\",\"coverImage\":\"$undefined\",\"author\":\"Leila Sloman\",\"section\":\"whatsup\"},\"next\":{\"slug\":\"slow-down-to-speed-up-ai-software-engineering\",\"href\":\"/whatsup/tldr/hn-2026-p9/slow-down-to-speed-up-ai-software-engineering\",\"category\":\"tldr\",\"title\":\"慢下来才能加速：AI与软件工程\",\"date\":\"2026-06-23\",\"excerpt\":\"以Meta旗下Instagram账号劫持事件为切入点，剖析AI生成代码由AI审查、token刷量与组织性亢奋如何侵蚀工程文化，并给出行业趋势判断与工程师职业建议。\",\"coverImage\":\"$undefined\",\"author\":\"The Pragmatic Engineer\",\"section\":\"whatsup\"}},\"headings\":[{\"depth\":2,\"text\":\"摘要\",\"id\":\"摘要\"},{\"depth\":2,\"text\":\"内容框架与概述\",\"id\":\"内容框架与概述\"},{\"depth\":2,\"text\":\"核心概念及解读\",\"id\":\"核心概念及解读\"},{\"depth\":2,\"text\":\"原文信息\",\"id\":\"原文信息\"}],\"sidebar\":null,\"directoryHref\":\"/whatsup?tab=tldr\",\"isLongArticle\":false,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L18\"}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"摘要\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#摘要\",\"children\":\"摘要\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章以 Hartnett 新书为线索，讲述微软研究院的 de Moura 为验证程序正确性创造 Lean，几位已有声望的数学家却押上职业生涯用它形式化数学。手写证明依赖同行默契、习惯省略显然步骤，而形式化证明冗长数十倍却可被机器逐行核验。当 AI 产出证明的速度超过人类审读能力，形式化验证层正从可选变为必需，但它只能确认答案是否符合规范，无法判断问题本身问得对不对。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章从数学家集体跳过显然步骤的书写习惯切入，指出完整展开的证明不可读，因而数学长期依赖同行间的默契与信任。这一缺口正是形式化验证试图填补的地方，也构成了全书的问题起点。作者由此引出 Lean 的诞生语境：它最初只是软件工程中证明程序正确性的工具，与数学并无关系。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"随后叙述 Lean 的冷启动十年。四五个已获成就的数学家放弃稳妥的中途事业，投入一件极其枯燥、成败未卜的工作：把数学写成机器可逐步检查的形式。文章用 de Bruijn 因子说明代价，手写证明被形式化后往往膨胀二十到一百倍，而正是这种笨拙换来了无可辩驳的确定性。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"最后落到当下转折。AI 已能批量生成数学论证，人类再也读不完，形式化层因此从可选变为必需。作者借 Peter Scholze 形式化自身工作的经历指出，形式化并未磨平洞见，反而逼人把论证理解得更精确，也冷静划出边界：它只保证答案符合规范。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"Lean\"}],\"：微软研究院 de Moura 开发的定理证明器，用代码书写数学证明并由机器校验。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"Mathlib\"}],\"：Lean 社区共建的数学概念公共库，使形式化证明可复用既有定义与定理。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"de Bruijn 因子\"}],\"：形式化证明与手写证明的长度之比，常在二十到一百倍之间。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"形式化验证\"}],\"：机器逐步校验代码是否满足规范，能确认答案正确，却无法判断问题问得对不对。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\"
