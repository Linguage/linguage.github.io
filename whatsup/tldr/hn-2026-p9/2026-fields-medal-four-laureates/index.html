es\",\"category\":\"tldr\",\"title\":\"2026菲尔兹奖揭晓：四位数学新星\",\"date\":\"2026-07-23\",\"excerpt\":\"2026年菲尔兹奖授予邓煜、潘德尔、齐默尔曼与王虹四位数学家，文章分述其流体力学、辛几何、数论与调和分析领域的突破性成果。\",\"coverImage\":\"$undefined\",\"author\":\"Davide Castelvecchi\",\"section\":\"whatsup\"},\"neighbors\":{\"previous\":{\"slug\":\"terence-tao-ai-views-living-summary\",\"href\":\"/whatsup/tldr/hn-2026-p9/terence-tao-ai-views-living-summary\",\"category\":\"tldr\",\"title\":\"陶哲轩论AI的认知边界与实践准则\",\"date\":\"2026-07-24\",\"excerpt\":\"陶哲轩AI观点活文档摘要，梳理其对AI本质、数学应用场景与使用边界的判断，强调概率核与可验证性优势，并用比较优势与可接受错误率两问指导实践。\",\"coverImage\":\"$undefined\",\"author\":\"$undefined\",\"section\":\"whatsup\"},\"next\":{\"slug\":\"odysseus-myth-through-the-ages-museum-art\",\"href\":\"/whatsup/tldr/hn-2026-p9/odysseus-myth-through-the-ages-museum-art\",\"category\":\"tldr\",\"title\":\"奥德修斯神话为何千年不衰\",\"date\":\"2026-07-23\",\"excerpt\":\"诺兰电影《奥德赛》带动古希腊史诗热潮，本文巡礼美国多家博物馆的历代相关藏品，从陶板银杯到嫁妆箱绘画，揭示奥德修斯因人性而非神力而长盛不衰的魅力。\",\"coverImage\":\"$undefined\",\"author\":\"Ilaria Parogni\",\"section\":\"whatsup\"}},\"headings\":[{\"depth\":2,\"text\":\"摘要\",\"id\":\"摘要\"},{\"depth\":2,\"text\":\"内容框架与概述\",\"id\":\"内容框架与概述\"},{\"depth\":2,\"text\":\"核心概念及解读\",\"id\":\"核心概念及解读\"},{\"depth\":2,\"text\":\"原文信息\",\"id\":\"原文信息\"}],\"sidebar\":null,\"directoryHref\":\"/whatsup?tab=tldr\",\"isLongArticle\":false,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L18\"}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"摘要\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#摘要\",\"children\":\"摘要\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"2026年菲尔兹奖在费城国际数学家大会上揭晓，邓煜、潘德尔、齐默尔曼和王虹四位数学家获奖，研究横跨数论、数学物理与调和分析。其中邓煜和王虹出生于中国，王虹是史上第三位女性得主。文章逐一介绍四人的成长背景与代表性成就，并指出中国数学人才群体正在崛起。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[1
