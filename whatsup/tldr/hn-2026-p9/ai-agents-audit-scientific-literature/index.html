-scientific-literature\",\"href\":\"/whatsup/tldr/hn-2026-p9/ai-agents-audit-scientific-literature\",\"category\":\"tldr\",\"title\":\"AI智能体审查文献发现陈旧错误\",\"date\":\"2026-08-06\",\"excerpt\":\"化学家用AI预测沸点时发现使用了75年的参考数据库存在错误，研究者进一步用AI智能体核查顶会论文的可复现性与错误率，同时提醒这类查错工具会误报漏判，最终判断仍须人工监督\",\"coverImage\":\"$undefined\",\"author\":\"Chris Stokel-Walker\",\"section\":\"whatsup\"},\"neighbors\":{\"previous\":{\"slug\":\"heisuke-hironaka-resolution-of-singularities\",\"href\":\"/whatsup/tldr/hn-2026-p9/heisuke-hironaka-resolution-of-singularities\",\"category\":\"tldr\",\"title\":\"广中平祐与奇点消解的一生\",\"date\":\"2026-08-28\",\"excerpt\":\"代数几何学家广中平祐以1964年任意维度奇点消解证明闻名，获1970年菲尔兹奖，其成果成为数学各领域的标准工具，本文回顾其生平、师承与提携后学的教育理念。\",\"coverImage\":\"$undefined\",\"author\":\"Allyn Jackson\",\"section\":\"whatsup\"},\"next\":{\"slug\":\"erdos-problems-falling-to-ai\",\"href\":\"/whatsup/tldr/hn-2026-p9/erdos-problems-falling-to-ai\",\"category\":\"tldr\",\"title\":\"传奇Erdős问题为何接连被AI攻克\",\"date\":\"2026-08-03\",\"excerpt\":\"从Thomas Bloom搭建的问题清单网站，到OpenAI模型接连破解Erdős猜想与难题，文章讲述业余爱好者、陶哲轩与AI如何共同改写数学研究的方式。\",\"coverImage\":\"$undefined\",\"author\":\"Konstantin Kakaes\",\"section\":\"whatsup\"}},\"headings\":[{\"depth\":2,\"text\":\"摘要\",\"id\":\"摘要\"},{\"depth\":2,\"text\":\"内容框架与概述\",\"id\":\"内容框架与概述\"},{\"depth\":2,\"text\":\"核心概念及解读\",\"id\":\"核心概念及解读\"},{\"depth\":2,\"text\":\"原文信息\",\"id\":\"原文信息\"}],\"sidebar\":null,\"directoryHref\":\"/whatsup?tab=tldr\",\"isLongArticle\":false,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L18\"}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"摘要\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#摘要\",\"children\":\"摘要\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"化学家用AI预测沸点时发现，沿用75年的参考数据库部分数值一直有误，核对原始文献后证实是数据库错了。研究者随后用AI智能体复核ICML论文声明，能完全复现者寥寥，另一项扫描显示NeurIPS论文错误五年上升55%。专家强调AI查错器会误报也会漏判，只能提示疑点，判断仍须人类把关。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章从一个具体案例切入：理论化学家Pios用AI预测分子沸点，结果与权威手册冲突，人工回溯原始文献后确认错的是数据库而非模型。由此引出AI正被越来越多科学家用作审计科学知识的工具。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"随后给出规模化证据。SAI Labs用AI智能体评估168篇ICML 2026口头报告论文，在92篇有足够声明的论文中，仅34篇能复现超过五分之二的声明，仅8篇复现率超过80%。斯坦福Zou团队扫描NeurIPS论文，发现客观错误从2021年的3.8个升至2025年的5.9个。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"第三层是争议与局限。研究者指出AI查错器会像人一样犯错，可能把正确结论误标为错误，也会漏掉经人工审稿发现的多数错误。有团队有意只查公式、计算、图表等客观错误，把新颖性与意义留给人类判断。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"最后指向出路。AI更适合把可能的问题提请注意，而非自行判定论文对错；Black Spatula项目正用已知含错论文测试模型，再请专家评估，试图量化这类系统的可信度。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"AI事实核查智能体\"}],\"：能提取论文核心声明、下载资源、重跑实验并比对的自动化系统，用于批量审计文献。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"可复现性\"}],\"：他人依原始材料能否重现作者声明结果，是衡量研究可靠性的关键指标。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"误报\"}],\"：工具把正确结论错误标记为错误，是AI审稿介入出版决策时的主要风险。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"客观错误\"}],\"：指公式、计算、图表等可判定对错的问题，区别于数据解读与新颖性等主观判断。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"人工监督\"}],\"：专家强调AI只应提示疑点，最终判定必须由人类复核把关。\"]}],\"\\n\",[\"$\",\"hr\",null,{}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"原文信息\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#原文信息\",\"children\":\"原文信息\"}]}],\"\\n\",[\"$\",\"div\",null,{\"className\":\"my-8 overflow-x-auto border border-border shadow-sm\",\"children\":[\"$\",\"table\",null,{\"className\":\"w-full text-left border-collapse text-[14px] font-sans\",\"children\":[[\"$\",\"thead\",null,{\"className\":\"bg-placeholder/40 border-b border-accent/20\",\"children\":[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"字段\"}],[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"内容\"}]]}]}],[\"$\",\"tbody\",null,{\"className\":\"divide-y divide-border/50\",\"children\":[[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"原文\"}],[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":[\"$\",\"a\",null,{\"href\":\"https://www.nature.com/articles/d41586-026-02235-8\",\"children\":\"AI agents are checking the scientific literature — and spotting decades-old errors\"}]}]]}],[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"作者\"}],[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"Chris Stokel-Walker\"}]]}],[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"child
