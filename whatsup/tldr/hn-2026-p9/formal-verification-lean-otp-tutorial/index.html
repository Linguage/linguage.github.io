\",\"href\":\"/whatsup/tldr/hn-2026-p9/formal-verification-lean-otp-tutorial\",\"category\":\"tldr\",\"title\":\"用 Lean 形式化验证一次性密码本入门\",\"date\":\"2026-07-15\",\"excerpt\":\"面向密码学工程师的 Lean 4 形式化验证入门教程第一部分，讲解如何用 Lean 定义比特串与异或，并逐步形式化验证一次性密码本的正确性。\",\"coverImage\":\"$undefined\",\"author\":\"$undefined\",\"section\":\"whatsup\"},\"neighbors\":{\"previous\":{\"slug\":\"first-human-x-rays-in-space\",\"href\":\"/whatsup/tldr/hn-2026-p9/first-human-x-rays-in-space\",\"category\":\"tldr\",\"title\":\"宇航员首次在轨完成人体X光成像\",\"date\":\"2026-07-15\",\"excerpt\":\"全平民太空任务 Fram2 首次在轨拍出可用于诊断的人体X光影像，验证便携X射线设备在微重力下的可行性，为未来月球与火星任务中不依赖地球的自主医疗诊断奠定基础。\",\"coverImage\":\"$undefined\",\"author\":\"Michelle Starr\",\"section\":\"whatsup\"},\"next\":{\"slug\":\"roman-concrete-durability-carbonation-latrine\",\"href\":\"/whatsup/tldr/hn-2026-p9/roman-concrete-durability-carbonation-latrine\",\"category\":\"tldr\",\"title\":\"罗马混凝土千年不倒的碳化之谜\",\"date\":\"2026-07-14\",\"excerpt\":\"新研究从哈德良别墅一座1900年前的厕所混凝土取样，发现除火山灰反应外，长期碳化生成的方解石也是关键粘结物，能自动封堵裂缝，为低碳水泥研发提供线索。\",\"coverImage\":\"$undefined\",\"author\":\"Sara Hashemi\",\"section\":\"whatsup\"}},\"headings\":[{\"depth\":2,\"text\":\"摘要\",\"id\":\"摘要\"},{\"depth\":2,\"text\":\"内容框架与概述\",\"id\":\"内容框架与概述\"},{\"depth\":2,\"text\":\"核心概念及解读\",\"id\":\"核心概念及解读\"},{\"depth\":2,\"text\":\"原文信息\",\"id\":\"原文信息\"}],\"sidebar\":null,\"directoryHref\":\"/whatsup?tab=tldr\",\"isLongArticle\":false,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L18\"}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"摘要\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#摘要\",\"children\":\"摘要\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"本文是 HashCloak 出品的 Lean 形式化验证教程第一部分，面向密码学工程师。文章介绍 Lean 4 兼具函数式编程语言与定理证明器的双重身份，并以 Boneh 与 Shoup 的密码学教材为定义来源，按照定义比特串、证明异或性质、定义 Shannon 密码、验证一次性密码本的路线，把纸面数学证明转写为可被机器检查的代码。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章开篇界定形式化验证的用途：把数学证明写成代码交给机器检查，从而确保证明正确，并列举 Rocq、Isabelle 与 Lean 三类工具。作者说明本教程面向密码学背景的读者，目标是把简单密码协议的定义与证明移植到 Lean，并用 VC V-io 的已形式化密码学证明作为进阶参照。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"随后文章介绍 Lean 的来历与特性。Lean 由 Leonardo de Moura 于 2013 年创造，是纯函数式语言，程序无副作用且函数为一等值。作者给出若干学习资源，包括逻辑验证指南、Lean 官网教材与自然数游戏，并解释自己重写教程的原因在于填补密码学与初学者之间的空白。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"第三部分锁定要移植的数学对象。作者以 Boneh 与 Shoup 教材中 Shannon 密码的三条性质为纲，指出其中两条规定加解密函数，第三条是解密可还原明文的正确性；一次性密码本的加解密都是异或。由此列出四步计划：定义比特串与异或、证明异或的交换律结合律单位元与自逆、定义 Shannon 密码、证明一次性密码本是 Shannon 密码。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"最后进入第一部分实操。作者先引入有限域库 ZMod，用 ZMod 2 的向量定义长度为 L 的比特串这一依赖类型，再定义异或函数，并借此讲解隐式参数、柯里化与 lambda 函数，以及如何用 zipWith 对两个向量做逐分量运算。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"Lean 4\"}],\"：兼顾函数式编程与定理证明的语言，2013 年由 Leonardo de Moura 创建，编译通过的证明即视为正确。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"形式化验证\"}],\"：将数学证明写成代码交由机器检查，便于拆分证明、多人协作与自动补全缺失步骤。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"Shannon 密码\"}],\"：由加密函数、解密函数与正确性三条性质构成，正确性指解密能够还原原始明文。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"一次性密码本\"}],\"：加解密均为按位异或，本教程要证明它符合 Shannon 密码的正确性要求。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"ZMod 与 XOR 性质\"}],\"：ZMod n 提供模 n 算术，比特串视为二元域上的向量，异或满足交换律、结合律、单位元与自逆。\"]}],\"\\n\",[\"$\",\"hr\",null,{}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"原文信息\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#原文信息\",\"children\":\"原文信息\"}]}],\"\\n\",[\"$\",\"div\",null,{\"className\":\"my-8 overflow-x-auto border border-border shadow-sm\",\"children\":[\"$\",\"table\",null,{\"className\":\"w-full text-left border-collapse text-[14px] font-sans\",\"children\":[[\"$\",\"thead\",null,{\"className\":\"bg-placeholder/40 border-b border-accent/20\",\"children\":[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"字段\"}],[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"内容\"}]]}]}],[\"$\",\"tbody\",null,{\"className\":\"divide-y divide-border/50\",\"children\":[[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"原文\"}],[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":[\"$\",\"a\",null,{\"href\":\"https://hashcloak.com/blog/tutorial-introduction-to-formal-verification-with-lean-(part-1)\",\"children\":\"Tutorial: Introduction to Formal Verification with Lean (Part 1)\"}]}]]}],[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text
