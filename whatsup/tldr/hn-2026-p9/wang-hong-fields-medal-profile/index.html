26-p9/wang-hong-fields-medal-profile\",\"category\":\"tldr\",\"title\":\"从北大数学系小透明到菲尔兹奖得主王虹专访\",\"date\":\"2026-07-24\",\"excerpt\":\"中国数学家王虹获2026年菲尔兹奖，成为首位中国籍女性得主。专访回溯她从北大转系的小透明到证明三维挂谷猜想的求索历程，展现热爱、挫败与坚持的力量。\",\"coverImage\":\"$undefined\",\"author\":\"$undefined\",\"section\":\"whatsup\"},\"neighbors\":{\"previous\":{\"slug\":\"fields-medal-claiming-credit\",\"href\":\"/whatsup/tldr/hn-2026-p9/fields-medal-claiming-credit\",\"category\":\"tldr\",\"title\":\"菲尔兹奖之后的攀亲与反思\",\"date\":\"2026-07-26\",\"excerpt\":\"借王虹与邓煜获菲尔兹奖一事，批评成名后众人攀亲认领关系的刻奇现象，并反思中国基础教育擅长训练却难以容纳原创研究者的结构性缺陷。\",\"coverImage\":\"$undefined\",\"author\":\"$undefined\",\"section\":\"whatsup\"},\"next\":{\"slug\":\"algebraic-geometry-landscapes\",\"href\":\"/whatsup/tldr/hn-2026-p9/algebraic-geometry-landscapes\",\"category\":\"tldr\",\"title\":\"代数几何的千重风景：从圆锥曲线到概形\",\"date\":\"2026-07-24\",\"excerpt\":\"借Claire Voisin出任法兰西公学院首位数学女教授之机，巴黎南奥赛大学教授François Charles以问答形式讲述代数几何从古希腊圆锥曲线到格罗滕迪克概形理论的两千年演进及其当代活力。\",\"coverImage\":\"$undefined\",\"author\":\"$undefined\",\"section\":\"whatsup\"}},\"headings\":[{\"depth\":2,\"text\":\"摘要\",\"id\":\"摘要\"},{\"depth\":2,\"text\":\"内容框架与概述\",\"id\":\"内容框架与概述\"},{\"depth\":2,\"text\":\"核心概念及解读\",\"id\":\"核心概念及解读\"},{\"depth\":2,\"text\":\"原文信息\",\"id\":\"原文信息\"}],\"sidebar\":null,\"directoryHref\":\"/whatsup?tab=tldr\",\"isLongArticle\":false,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L18\"}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"摘要\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#摘要\",\"children\":\"摘要\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"王虹35岁获2026年菲尔兹奖，成为首位中国籍女性得主。文章追溯她自广西桂林的数学启蒙、北大转系的挣扎、巴黎读研时的动摇，以及麻省理工导师古斯的启发，直至与合作者证明三维挂谷猜想。核心观点是数学之路靠热爱与好心态支撑，而非一路高光的天才神话。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章以获奖为引子，先破除自媒体塑造的天才神话。王虹自述获奖挺好但题该做不出来还是做不出来，生活并无变化，日常仍在想难题、开讨论会，为全文定下平实克制的基调。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"随后按时间线展开成长轨迹。桂林童年因教材中的想一想栏目爱上动脑，中学成绩平平，十六岁考入北大却被地球与空间科学学院录取，靠堪比二次高考的努力在大二转入数学系，却在奥数金牌得主云集的环境中自认小透明。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"接着写求索中的动摇与转折。巴黎读研时她一度考虑转行建筑，实习后认清数学可完全靠自己建构想法的价值；到麻省理工遇导师古斯，学会把混乱模糊的想法讲清楚，不再纠结自己是否擅长数学。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"最后进入科研攻坚与外部评价。黏性假设成为挂谷猜想的突破口，她与Zahl合作完成三部曲。文章援引田刚、苗长兴、丘成桐等人的评价，强调她绝非一战成名，结尾指向更高维、更困难的新猜想。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"挂谷猜想\"}],\"：1917年由日本数学家挂谷宗一提出的几何谜题，调和分析领域三个不朽猜想均矗立其上。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"黏性\"}],\"：三维挂谷猜想中最棘手的关键几何特性描述，陶哲轩曾推测反例很可能具有黏性。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"调和分析\"}],\"：王虹深耕的研究领域，她在傅里叶限制性猜想、福尔克纳距离集等方向亦有重大突破。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"二次高考\"}],\"：对北大转系艰难程度的生动比喻，需本专业与转系考试排名同时靠前，且须自学受限课程。\"]}],\"\\n\",[\"$\",\"hr\",null,{}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text trac
