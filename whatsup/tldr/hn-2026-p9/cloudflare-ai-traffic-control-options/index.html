"Cloudflare 在其第二个内容独立日宣布，将 AI 流量管理从笼统的封锁 AI 机器人升级为按搜索、代理、训练三类用途细分管控，覆盖包括免费版在内的全部客户。文章指出，内容方既想保护原创，又不愿失去可发现性，因此需要更细粒度而非一刀切的选择。自 2026 年 9 月 15 日起，新接入域名在展示广告的页面上默认屏蔽训练与代理爬虫，搜索保持放行；混合用途爬虫按最严格规则处理。同时面向企业客户推出 BotBase 机器人目录，先做可见性再做控制。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章以内容独立日一周年为切入点，回顾一年前推出的封锁 AI 机器人与按次付费抓取方案，指出行业诉求已从单纯反对无偿训练，转向既要保护内容又要保留曝光与补偿的更细致平衡。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"随后文章解释了为何放弃以是否属于 AI 来定义机器人，转而追问机器人在站点上做什么、存储什么、如何再分享内容，并提出搜索、代理、训练三类务实分类法，同时呼吁厂商将混合用途的自动化拆分为独立爬虫以提升透明度。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"接着文章介绍具体的产品与默认策略变更，说明广告页与搜索流量的不同处理逻辑，以及混合用途爬虫按最严格规则执行的后果，并强调客户可随时在安全设置中选择退出默认配置。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"最后文章介绍面向企业客户的 BotBase，作为可搜索的机器人目录与后续控制中枢，并给出更完整的机器人行为分类表，涵盖交易、数据采集与安全测试等用途。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"搜索类爬虫\"}],\"：抓取并建立站点索引以便日后回答查询，站主应获得引荐流量或等值补偿。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"代理类爬虫\"}],\"：代表真人实时访问网页应用完成某项任务，通常有人类在另一端等待结果。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"训练类爬虫\"}],\"：抓取内容用于训练或微调模型，数据被永久吸收进模型底层架构。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",
