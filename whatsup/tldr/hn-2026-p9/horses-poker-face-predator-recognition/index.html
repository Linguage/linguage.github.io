ion\",\"href\":\"/whatsup/tldr/hn-2026-p9/horses-poker-face-predator-recognition\",\"category\":\"tldr\",\"title\":\"马识捕食者心率飙升却面不改色\",\"date\":\"2026-07-16\",\"excerpt\":\"研究让18匹马在静音视频中仅凭视觉辨别狼与袋熊，发现马看狼时心率显著升高却无任何外在应激行为，揭示高警觉与外表平静的分离，对骑乘安全与马匹福利有提示意义。\",\"coverImage\":\"$undefined\",\"author\":\"The Ohio State University\",\"section\":\"whatsup\"},\"neighbors\":{\"previous\":{\"slug\":\"zeta-process-orrery-visualization-apps\",\"href\":\"/whatsup/tldr/hn-2026-p9/zeta-process-orrery-visualization-apps\",\"category\":\"tldr\",\"title\":\"陶哲轩论智能体编程与数学可视化应用\",\"date\":\"2026-07-16\",\"excerpt\":\"陶哲轩用编码智能体制作两个可视化应用，并给出适合委托给大模型的五条判断标准，认为可视化程序是智能体编程的优良场景。\",\"coverImage\":\"$undefined\",\"author\":\"Terence Tao\",\"section\":\"whatsup\"},\"next\":{\"slug\":\"meta-ai-layoffs-lawsuit\",\"href\":\"/whatsup/tldr/hn-2026-p9/meta-ai-layoffs-lawsuit\",\"category\":\"tldr\",\"title\":\"Meta被诉用AI算法裁员涉嫌歧视\",\"date\":\"2026-07-15\",\"excerpt\":\"Meta遭26名前员工起诉，指控其以Metamate等内部AI系统为员工打分排名并据此裁减8000人，使休受保护病假与残障员工被不成比例选中，涉嫌违反多项反歧视法；Meta否认指控，称裁员决策由人做出。\",\"coverImage\":\"$undefined\",\"author\":\"Jon Brodkin\",\"section\":\"whatsup\"}},\"headings\":[{\"depth\":2,\"text\":\"摘要\",\"id\":\"摘要\"},{\"depth\":2,\"text\":\"内容框架与概述\",\"id\":\"内容框架与概述\"},{\"depth\":2,\"text\":\"核心概念及解读\",\"id\":\"核心概念及解读\"},{\"depth\":2,\"text\":\"原文信息\",\"id\":\"原文信息\"}],\"sidebar\":null,\"directoryHref\":\"/whatsup?tab=tldr\",\"isLongArticle\":false,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L18\"}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"摘要\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#摘要\",\"children\":\"摘要\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"俄亥俄州立大学研究让18匹马在隔音无味的马厩中观看静音视频，仅凭视觉线索辨别捕食者。观看狼时马的心率显著高于观看袋熊时，却不摆头、不甩尾，也无固定凝视等外在反应，呈现高警觉与外表平静的分离。雄性及高社会地位马反应更强。研究提示骑手与饲养者难以察觉马匹的内部紧张，对骑乘安全与动物福利具现实意义。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"研究以隔离感官为切入点，让马匹在标准马厩中观看三段各20秒的静音视频，内容为袋熊与狼群的攻击或理毛行为，并同步记录心率与摄像，另收集年龄、性别、群体地位与性情数据，探究纯视觉条件下的捕食者识别能力。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"结果出人意料：面对袋熊心率维持基线，面对狼时心率一律显著升高，无论狼在争斗还是理毛，马匹并未区分两种情境。心率反应在雄性及高社会地位个体中更为明显，后者可能因在群体决策与带队中承担更多责任而更敏感。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"凝视数据提供了关键解释。以往认为动物用左眼评估威胁、右眼进行认知加工，而本研究中马看狼时无单侧偏好，看袋熊时则以双眼专注直视。研究者推测马在二十秒内即完成快速评估，因威胁未真正兑现，故不表现出可见行为。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"作者强调，猎物动物被普遍低估认知水平，而本研究显示马具备高度认知加工与克制能力。内部紧张与外表静止的脱节提醒人们，缺乏明显应激信号并不代表马匹安然无事。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"纯视觉捕食者识别\"}],\"：剥离气味与声音后，马仅凭画面即可判定狼为威胁。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"心率行为解耦\"}],\"：内在警觉升高与外在行为静止可同时存在，心率比动作更诚实。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"单侧凝视假说\"}],\"：动物以左眼评估威胁、右眼进行认知加工，本研究中该偏好消失。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"社会地位调节\"}],\"：高地位个体反应更强，因其在群体安全决策中角色更重。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"猎物动物认知\"}],\"：掠食者与猎物均可能具备被长期低估的高级认知加工能力。\"]}],\"\\n\",[\"$\",\"hr\",null,{}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"原文信息\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#原文信息\",\"children\":\"原文信息\"}]}],\"\\n\",[\"$\",\"div\",null,{\"className\":\"my-8 overflow-x-auto border border-border shadow-sm\",\"children\":[\"$\",\"table\",null,{\"className\":\"w-full text-left border-collapse text-[14px] font-sans\",\"children\":[[\"$\",\"thead\",null,{\"className\":\"bg-placeholder/40 border-b border-accent/20\",\"children\":[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"字段\"}],[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"内容\"}]]}]}],[\"$\",\"tbody\",null,{\"className\":\"divide-y divide-border/50\",\"children\":[[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"原文\"}],[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":[\"$\",\"a\",null,{\"href\":\"https://news.osu.edu/when-eyeing-a-predator-horses-keep-a-poker-face-as-their-hearts-race/\",\"children\":\"When eyeing a predator, horses keep a poker face as their hearts race\"}]}]]}],[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"作者\"}],[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"The Ohio State University\"}]]}],[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text
