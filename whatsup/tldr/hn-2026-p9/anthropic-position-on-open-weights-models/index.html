,null,{\"post\":{\"slug\":\"anthropic-position-on-open-weights-models\",\"href\":\"/whatsup/tldr/hn-2026-p9/anthropic-position-on-open-weights-models\",\"category\":\"tldr\",\"title\":\"Anthropic 对开放权重模型的立场与主张\",\"date\":\"2026-07-28\",\"excerpt\":\"Anthropic CEO Dario Amodei 澄清公司从未主张禁止开放权重模型，提出芯片管制、打击蒸馏与强制安全测试三项替代方案，回应国家安全与滥用风险。\",\"coverImage\":\"$undefined\",\"author\":\"$undefined\",\"section\":\"whatsup\"},\"neighbors\":{\"previous\":{\"slug\":\"manuel-neuer-bayern-preseason-training-camp\",\"href\":\"/whatsup/tldr/hn-2026-p9/manuel-neuer-bayern-preseason-training-camp\",\"category\":\"tldr\",\"title\":\"诺伊尔季前集训谈新赛季目标与退役计划\",\"date\":\"2026-07-29\",\"excerpt\":\"拜仁队长诺伊尔在泰根湖训练营回顾世界杯出局，阐述新赛季争冠目标，并坦言很可能在赛季结束后退役。\",\"coverImage\":\"$undefined\",\"author\":\"FC Bayern München AG\",\"section\":\"whatsup\"},\"next\":{\"slug\":\"fields-medal-claiming-credit\",\"href\":\"/whatsup/tldr/hn-2026-p9/fields-medal-claiming-credit\",\"category\":\"tldr\",\"title\":\"菲尔兹奖之后的攀亲与反思\",\"date\":\"2026-07-26\",\"excerpt\":\"借王虹与邓煜获菲尔兹奖一事，批评成名后众人攀亲认领关系的刻奇现象，并反思中国基础教育擅长训练却难以容纳原创研究者的结构性缺陷。\",\"coverImage\":\"$undefined\",\"author\":\"$undefined\",\"section\":\"whatsup\"}},\"headings\":[{\"depth\":2,\"text\":\"摘要\",\"id\":\"摘要\"},{\"depth\":2,\"text\":\"内容框架与概述\",\"id\":\"内容框架与概述\"},{\"depth\":2,\"text\":\"核心概念及解读\",\"id\":\"核心概念及解读\"},{\"depth\":2,\"text\":\"原文信息\",\"id\":\"原文信息\"}],\"sidebar\":null,\"directoryHref\":\"/whatsup?tab=tldr\",\"isLongArticle\":false,\"fullContentUrl\":null,\"contentLength\":\"$undefined\",\"children\":\"$L18\"}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"摘要\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#摘要\",\"children\":\"摘要\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"Anthropic CEO Dario Amodei 明确表态反对禁止开放权重模型，认为无危险能力的开放权重模型属于公共品。他提出两大隐患：威权政府获得超越美国的AI用于军事与镇压，以及强大模型被用于网络与生物攻击。主张以芯片管制、打击蒸馏、强制安全测试三项措施应对，而非一刀切禁令。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章开篇澄清立场，回应外界认为Anthropic借禁令保护商业利益的指控，明确公司从未主张禁止开放权重模型这一类别，并承认无危险能力的开放权重模型具有公共品价值，为开发者和研究者带来实际收益。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"随后铺陈两大担忧：首要担忧是威权政府（其中中共能力最强）构建超越美国的模型以实现永久军事优势或深度镇压；次要担忧是模型被用于网络与生物攻击及对齐失效。开放权重因难以监控、难以撤回，潜在风险更高。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"基于此作者提出三项主张：不向中国出售先进芯片并打击走私绕道；打击工业级蒸馏行为；要求所有足够强大的模型不论开放或闭源均须通过发布前的强制性安全测试，且有效测试需全球参与。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"最后评论业界公开信，认同开放权重能扩大经济参与并促进竞争，但质疑其关于防御者必然受益、安全性更易保障的断言，强调生物领域可能攻防严重不对称，相关问题应由实证测试回答而非预先假定。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"开放权重模型\"}],\"：权重可公开下载并自行运行的模型，除算力外几乎无使用成本，但发布后无法撤回或加装护栏。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"蒸馏攻击\"}],\"：以远低于从零训练的算力，通过大量查询提取前沿模型能力，使受限方仍能逼近领先前沿。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"芯片出口管制\"}],\"：限制先进芯片与制造设备流向中国，依据规模定律从源头阻断其训练更强模型的能力。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"强制性安全测试\"}],\"：所有足够强大模型在发布前须接受网络、生物与对齐风险评估，是应对滥用的直接手段。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"攻防不对称\"}],\"：作者认为生物等领域攻击成本可能远低于防御，反驳开放能力必然更利于防御者的假设。\"]}],\"\\n\",[\"$\",\"hr\",null,{}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"原文信息\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#原文信息\",\"children\":\"原文信息\"}]}],\"\\n\",[\"$\",\"div\",null,{\"className\":\"my-8 overflow-x-auto border border-border shadow-sm\",\"children\":[\"$\",\"table\",null,{\"className\":\"w-full text-left border-collapse text-[14px] font-sans\",\"children\":[[\"$\",\"thead\",null,{\"className\":\"bg-placeholder/40 border-b border-accent/20\",\"children\":[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"字段\"}],[\"$\",\"th\",null,{\"className\":\"py-4 px-6 font-bold text-text/80\",\"children\":\"内容\"}]]}]}],[\"$\",\"tbody\",null,{\"className\":\"divide-y divide-border/50\",\"children\":[[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"原文\"}],[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":[\"$\",\"a\",null,{\"href\":\"https://www.anthropic.com/news/position-open-weights-models\",\"children\":\"Our position on open-weights models\"}]}]]}],[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"作者\"}],[\"$\",\"td\",null,{\"className\":\"py-4 px-6 text-text/90 align-top\",\"children\":\"$undefined\"}]]}],[\"$\",\"tr\",null,{\"className\":\"hover:bg-accent/5 transition-colors\",\"children\":[[\"$\",\"td\",null,{\"className\":\"p
