他先以函数分析博士论文成名，后转向代数几何，用概型、拓扑斯等宏大结构重塑学科，1966年获菲尔兹奖。约七万页手稿由 Grothendieck circle 整理，他晚年亦投身生态与反核运动，兼具天才与介入者双重身份。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"内容框架与概述\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#内容框架与概述\",\"children\":\"内容框架与概述\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"文章以问答访谈形式展开，围绕格罗滕迪克逝世十周年，邀请数学家 Leila Schneps 回溯其学术生涯与遗产整理工作。开篇交代 Grothendieck circle 的缘起：2003 年一群数学家与旧友聚于巴黎咖啡馆，决定汇集散落各处的信件、笔记与未刊稿。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"随后按时间顺序梳理他三段数学时期。第一段是函数分析，他引入核空间解决拓扑学难题，导师甚至称他终结了该课题。第二段自 1954 年起转向新兴的代数几何，他拥抱概型理论，视其为极具威力的工具，并在 1955 至 1970 年间产出巨量成果。\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":\"第三段聚焦他引入的拓扑斯概念，被形容为万花筒式的物体，凝聚对同一对象的所有可能视角。访谈最后坦承，他设想中统一几何与算术的桥梁至今尚未真正建成，因他未清晰指明路径，其抽象视野也难被同行完全承接。\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"scroll-mt-[120px] font-serif text-[20px] md:text-[22px] font-bold text-text tracking-tight mt-[34px] mb-[15px] leading-[1.28]\",\"id\":\"核心概念及解读\",\"children\":[\"$\",\"a\",null,{\"className\":\"heading-anchor\",\"href\":\"#核心概念及解读\",\"children\":\"核心概念及解读\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"概念名称：概型（schémas）\"}],\"：以复杂数学对象取代方程来刻画代数簇，便于极精细地测量其性质。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"概念名称：拓扑斯（topos）\"}],\"：借重构点的定义推广空间概念，每个点携带测量信息的复杂对象。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"概念名称：核空间\"}],\"：格罗滕迪克在论文中提出的空间类型，其上两种自然拓扑重合。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"概念名称：Grothendieck circle\"}],\"：为汇集其手稿与信件而成立的数学家与旧友协作组织。\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"mb-6\",\"children\":[[\"$\",\"str
